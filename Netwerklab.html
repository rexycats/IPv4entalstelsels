T[4].title='Gateway, DHCP, MAC en problemen oplossen'; T[4].short='Gateway, DHCP en testen';
T[4].html+=`<h2>IP-instellingen in Windows</h2>
<p>Je instellingen bekijken kan op twee manieren: met <code>ipconfig /all</code>, of via <b>Win + R</b>, typ <code>ncpa.cpl</code>, dubbelklik op je netwerkadapter en kies <b>Details</b>. Let op: in het Engels (en in je cursus) heet de standaardgateway de <b>default gateway</b>.</p>
<p>Wijzigen: rechtsklik op de adapter › <b>Eigenschappen</b> › <b>Internet Protocol versie 4 (TCP/IPv4)</b>. Kies <b>Automatisch een IP-adres laten toewijzen</b> (DHCP, de beste keuze voor de meeste toestellen), of vul zelf een vast adres, masker, default gateway en DNS-server in.</p>
<h2>APIPA oplossen</h2>
<p>Zie je een 169.254-adres, dan kreeg je pc geen adres van de DHCP-server. Met zo'n adres kan je enkel praten met andere toestellen die ook een APIPA-adres hebben: internet lukt meestal niet. Controleer in deze volgorde:</p>
<ol><li>Is de netwerkkabel aangesloten, of ben je verbonden met de wifi?</li><li>Werkt de router of DHCP-server?</li><li>Staat de adapter op "Automatisch een IP-adres laten toewijzen"?</li><li>Schakel de netwerkadapter uit en weer in.</li><li>Herstart de computer en/of de router.</li><li>Vraag eventueel een nieuw adres aan: <code>ipconfig /release</code> en daarna <code>ipconfig /renew</code>.</li></ol>
<h2>Testen: ping, tracert en ipconfig</h2>
<div class="tw"><table><thead><tr><th>Commando</th><th>Welke vraag beantwoordt het?</th><th>Voorbeeld</th></tr></thead><tbody>
<tr><td><code>ping</code></td><td>Werkt de bestemming?</td><td><code>ping 8.8.8.8</code></td></tr>
<tr><td><code>tracert</code></td><td>Via welke weg gaat het verkeer?</td><td><code>tracert www.google.com</code></td></tr>
<tr><td><code>ipconfig</code></td><td>Wat is mijn eigen configuratie?</td><td><code>ipconfig /all</code></td></tr></tbody></table></div>
<p><code>tracert</code> (trace route) toont elke router onderweg, een <b>hop</b>, met zijn IP-adres en de responstijd. De eerste hop is bijna altijd je eigen default gateway. Zo zie je waar een verbinding vertraagt of onderbroken wordt.</p>
<p>Met <code>ping 127.0.0.1</code> test je je eigen netwerksoftware. Het <b>loopbackadres</b> verwijst altijd naar je eigen computer: de gegevens verlaten je pc niet.</p>
<h2>Praktijkvoorbeeld: vind de fout</h2>
<p>Een pc heeft deze instellingen, maar kan niet op het internet:</p>
<div class="vis">${cfgBlock({ip:'172.16.1.34',mask:'255.255.0.0',gw:'192.16.1.1'})}</div>
<p>Met masker 255.255.0.0 (/16) is het netwerkdeel <b>172.16</b>. De gateway begint met <b>192.16</b>: die zit in een ander netwerk, dus de pc kan hem niet bereiken. Binair zie je het meteen: 172 = <code>10101100</code>, maar 192 = <code>11000000</code>. Oplossing: een gateway in het eigen netwerk, bijvoorbeeld <b>172.16.1.1</b>.</p>
${ONT('Instellingen: ipconfig /all of ncpa.cpl. APIPA: kabel/wifi, router, automatisch, adapter uit en aan, ipconfig /release en /renew. Testen: ping (werkt het?), tracert (welke weg?), ipconfig (mijn instellingen).')}`;
T[4].quiz.push({q:'Wat doet tracert?',o:['Het toont via welke routers je verkeer reist','Het maakt de DNS-cache leeg','Het vraagt een nieuw IP-adres aan'],a:0,w:'tracert toont elke hop onderweg naar de bestemming.'},{q:'Je pc heeft 169.254.3.7. Welk commando vraagt een nieuw adres aan?',o:['ipconfig /renew','ipconfig /flushdns','tracert'],a:0,w:'Na ipconfig /release vraagt ipconfig /renew een nieuw adres aan bij de DHCP-server.'});
T[4].practice.push('foutconfig');

T[8].html+=`<h2>DNS instellen in Windows</h2>
<p>Windows gebruikt meestal automatisch de DNS-server die het van de router of DHCP-server krijgt. Je kan ook zelf een DNS-server instellen via adapter › Eigenschappen › <b>Internet Protocol versie 4 (TCP/IPv4)</b>. Bekende publieke DNS-servers zijn <code>8.8.8.8</code> (Google) en <code>1.1.1.1</code> (Cloudflare).</p>
<ul><li>De <b>primary DNS-server</b> wordt eerst geraadpleegd. Antwoordt die, dan stopt het zoeken.</li><li>De <b>secondary DNS-server</b> is een reserve: die wordt alleen gebruikt als de primary niet bereikbaar is. Bijvoorbeeld primary 8.8.8.8, secondary 8.8.4.4.</li></ul>
<h2>Het resolving-pad: hoe vindt DNS het adres?</h2>
<p>Stel dat je naar www.microsoft.com surft:</p>
<ol><li>Je browser vraagt het IP-adres op.</li><li>Je computer kijkt eerst lokaal: in de <b>DNS-cache</b> en het <b>hosts-bestand</b>.</li><li>Niet gevonden? Dan vraagt hij het aan de <b>DNS-server</b>.</li><li>Kent die het ook niet, dan zoekt de DNS-server verder via een <b>rootserver</b>. Die wijst naar de server van <b>.com</b>, en die naar de server van microsoft.com.</li><li>De DNS-server vindt het IP-adres en stuurt het terug.</li><li>Je browser maakt verbinding met de website.</li></ol>
<div class="vis"><div class="flow"><div class="node"><b>Cache</b>lokaal op je pc</div>${ARR}<div class="node"><b>DNS-server</b>uit je instellingen</div>${ARR}<div class="node dark"><b>Rootserver</b>bovenaan de hiërarchie</div>${ARR}<div class="node"><b>.com-server</b>en dan microsoft.com</div></div></div>
<p><b>Rootservers</b> staan bovenaan de DNS-hiërarchie. Ze weten welke servers verantwoordelijk zijn voor elke domeinextensie, zoals .be, .com en .org.</p>
<h2>DNS-commando's</h2>
<div class="tw"><table><thead><tr><th>Commando</th><th>Wat doet het?</th></tr></thead><tbody>
<tr><td><code>nslookup www.microsoft.com</code></td><td>Zoekt het IP-adres van een naam op: werkt DNS? (op Linux ook <code>dig</code>)</td></tr>
<tr><td><code>ipconfig /displaydns</code></td><td>Toont de lokale DNS-cache: welke namen heeft Windows onthouden?</td></tr>
<tr><td><code>ipconfig /flushdns</code></td><td>Maakt de DNS-cache leeg, zodat Windows opnieuw moet opzoeken. Ook de computer of browser herstarten wist de cache.</td></tr></tbody></table></div>
<h2>Het hosts-bestand</h2>
<p>Het <b>hosts-bestand</b> is een lokale lijst die namen omzet naar IP-adressen, nog vóór een DNS-server geraadpleegd wordt. Het staat in <code>C:\\Windows\\System32\\drivers\\etc</code>. Het wordt gebruikt bij <b>ping</b> en bij <b>surfen</b>, maar <b>niet bij nslookup</b>: nslookup vraagt altijd rechtstreeks aan de DNS-server.</p>
<p>Waarvoor pas je het aan? Een website testen voor de DNS aangepast is, een server een makkelijke naam geven (<code>nas</code> in plaats van 192.168.1.50), of een website blokkeren door ze naar 127.0.0.1 te laten wijzen. <b>Let op bij het bewerken:</b> je hebt beheerdersrechten nodig, en een fout in dit bestand kan websites onbereikbaar maken.</p>
<p>Naast hosts bestaat ook <b>LMHOSTS</b>. Dat is voor NetBIOS-naamresolutie: computernamen omzetten naar IP-adressen. Het wordt vandaag nog zelden gebruikt, omdat DNS die taak heeft overgenomen.</p>
${ONT('Resolving: cache en hosts → DNS-server (primary, dan secondary) → rootserver → .com-server → IP-adres terug. Commando\'s: nslookup, ipconfig /displaydns, ipconfig /flushdns.')}`;
T[8].quiz.push({q:'Wat doen rootservers?',o:['Ze wijzen naar de servers van .be, .com, .org …','Ze delen IP-adressen uit','Ze blokkeren websites'],a:0,w:'Rootservers staan bovenaan de DNS-hiërarchie en wijzen DNS-servers de juiste richting uit.'},{q:'Bij welk commando wordt het hosts-bestand niet gebruikt?',o:['nslookup','ping','surfen'],a:0,w:'nslookup vraagt altijd rechtstreeks aan de DNS-server.'});

function codeOf(name,klas,score,date){
  const s=`${name.trim().toLowerCase()}|${klas.trim().toLowerCase()}|${score}|${date.trim()}|nwlab-2026`;
  let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0;}
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let out='';
  for(let i=0;i<6;i++){out+=A[h%32]; h=Math.floor(h/32);}
  return out;
}

function answerOf(id,q){

    case 'hexdigit': return q.t==='toHex'?hx(q.v):String(q.v);

    case 'netwerk': return `${q.net}.0 · ${q.net}.255`;
    case 'geldig': return M.geldig.correct(q);

    case 'klasse': return 'klasse '+q.k;

    case 'dnsres': return DQ[q.i].o[DQ[q.i].a].replace(/<[^>]+>/g,'');
    case 'osi': case 'tcpudp': case 'foutconfig': return q.ans;
    case 'bigbin': return q.dir==='toBin'?q.n.toString(2):String(q.n);
    case 'bighex': return q.dir==='toDec'?String(q.n):hx(q.n);
    case 'subnethosts': return `/${q.p} = ${q.mask}`;

function confirmQ(){
  const card=$('#test-card'), it=test.qs[test.i], body=card.querySelector('#t-body'), msg=card.querySelector('#t-qmsg');
  const qtext=[...body.querySelectorAll('.prompt, .addr')].map(x=>x.textContent.trim()).join(' ');
  let ok, given;
  if(it.type==='open'){
    const t=body.querySelector('#t-open').value.trim();
    if(words(t)<10){msg.hidden=false; msg.textContent='Schrijf minstens 10 woorden.'; return;}
    ok=null; given=t; it.correct='beoordeling door de leerkracht';
  }else if(it.type==='mc'){
    if(test.picked===null){msg.hidden=false; msg.textContent='Kies eerst een antwoord.'; return;}
    ok=+test.picked===it.p.a; given=it.p.o[+test.picked];
    it.correct=it.p.o[it.p.a];
  }else{
    const m=M[it.id];
    if(m.choice){
      if(test.picked===null){msg.hidden=false; msg.textContent='Kies eerst een antwoord.'; return;}
      const r=m.check(it.q,body,test.picked); ok=r.ok;
      given=body.querySelector(`.choice[data-ans="${test.picked}"]`).textContent;
    }else{
      const r=m.check(it.q,body);
      if(r.empty){msg.hidden=false; msg.innerHTML=r.msg; return;}
      ok=r.ok;
      given=it.id==='dec2bin'?bin8(val(it.q.bits)):[...body.querySelectorAll('input.inp')].map(x=>x.value.trim()||'–').join(' · ');
    }
    it.correct=answerOf(it.id,it.q);
  }
  it.ok=ok; it.given=given; it.qtext=qtext;
  test.i++;
  if(test.i<test.qs.length){drawTestQ(); window.scrollTo({top:Math.min(window.scrollY,$('#mode-seg').getBoundingClientRect().top+window.scrollY)});}
  else finishTest();
}
function finishTest(){

  const score=auto.filter(x=>x.ok).length, date=fmtDate(new Date(end));

  const groups=gnames.map(g=>({t:g,f:x=>x.type==='mod'&&M[x.id].group===g}));
  const rows=groups.map(g=>{const xs=test.qs.filter(g.f); return {t:g.t,p:xs.filter(x=>x.ok).length,max:xs.length};});
  state.last={name:test.name,klas:test.klas,date,dur:`${Math.floor(secs/60)} min ${pad(secs%60)} s`,attempt:state.attempts,leaves:test.leaves,score,n:auto.length,rows,open:test.qs.filter(x=>x.type==='open').map(x=>({q:x.p.q,a:x.given})),
    items:test.qs.map(x=>({sec:secTitle(x),q:x.qtext,given:x.given,correct:x.correct,ok:x.ok})),code:codeOf(test.name,test.klas,String(score),date)};
  test.phase='done'; save(); drawTest();
}

const ip2int=s=>{const p=s.split('.').map(Number);return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3];};
const int2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const validV4=s=>!!s&&rules(s).valid;
function maskOf(s){
  s=(s||'').trim();
  const m=s.match(/^\/?(\d{1,2})$/);
  if(m){const p=+m[1]; if(p<0||p>32) return null; const n=p===0?0:((0xFFFFFFFF<<(32-p))>>>0); return {mask:int2ip(n),n,p};}
  if(!validV4(s)) return null;
  const n=ip2int(s), b=n.toString(2).padStart(32,'0');
  if(!/^1*0*$/.test(b)) return null;
  const p=b.indexOf('0')===-1?32:b.indexOf('0');
  return {mask:s,n,p};
}
const sameNet=(a,b,mn)=>((ip2int(a)&mn)>>>0)===((ip2int(b)&mn)>>>0);
const words=s=>(s||'').trim().split(/\s+/).filter(Boolean).length;
const LABOS={win:'Windows',mac:'macOS',lin:'Linux'};

function labChecks(n){
  const L=state.lab, out=[]; const add=(ok,t)=>out.push({ok,t});
  if(n===1){
    if(!L.ip||!L.mask||!L.gw) return {empty:'Vul je IPv4-adres, subnetmasker en gateway in.'};
    const ipOk=validV4(L.ip); add(ipOk, ipOk?'Je IPv4-adres is geldig.':'Je IPv4-adres is geen geldig adres. Controleer of je het juist overnam.');
    const mk=maskOf(L.mask); add(!!mk, mk?`Je masker is geldig: /${mk.p}.`:'Je subnetmasker klopt niet. Het ziet eruit als 255.255.255.0 (of /24 op Linux).');
    if(ipOk&&L.ip.startsWith('169.254.')) add(false,'Je adres begint met 169.254: je pc kreeg geen adres van DHCP. Vraag hulp aan je leerkracht.');
    if(ipOk&&mk){
      const gwOk=validV4(L.gw)&&sameNet(L.ip,L.gw,mk.n);
      add(gwOk, gwOk?'Je gateway zit in hetzelfde netwerk als je pc, zoals het hoort.':'Je gateway zit niet in hetzelfde netwerk als je pc. Controleer of je de juiste regel nam.');
      const net=int2ip((ip2int(L.ip)&mk.n)>>>0);
      if(!L.net) add(false,'Vul ook je netwerkadres in.'); else add(L.net.trim()===net, L.net.trim()===net?`Je netwerkadres ${net} is juist.`:`Je netwerkadres klopt niet. Houd het netwerkdeel (${mk.p===24?'eerste 3 getallen':mk.p===16?'eerste 2 getallen':mk.p===8?'eerste getal':'volgens het masker'}) en vul de rest aan met 0.`);
      const cat=classify(L.ip).cat;
      if(!L.soort) add(false,'Kies ook welk soort adres het is.'); else add(CATNAME[cat]===L.soort.toLowerCase(), CATNAME[cat]===L.soort.toLowerCase()?`Juist: je adres is ${CATNAME[cat]}.`:'Het soort adres klopt niet. Gebruik de 4 vragen uit hoofdstuk 6.');
      if(mk.p%8!==0) add(null,`Jouw netwerk gebruikt /${mk.p}. Dat is geen /8, /16 of /24: de app rekent het netwerkadres voor je uit (${net}).`);
    }
  }
  if(n===2){
    if(!L.mac&&!L.dhcp&&!L.dns) return {empty:'Vul je MAC-adres, DHCP en DNS-server in.'};
    const macOk=/^([0-9a-f]{2}[-:]){5}[0-9a-f]{2}$/i.test((L.mac||'').trim());
    add(macOk, macOk?'Je MAC-adres heeft de juiste vorm: 6 paren hexa.':'Een MAC-adres bestaat uit 6 paren hexa, bv. 3C-52-82-1A-9F-07.');
    if(!L.dhcp) add(false,'Kies of DHCP ingeschakeld is.'); else add(null, L.dhcp==='Ja'?'DHCP staat aan: je pc kreeg zijn adres automatisch van de DHCP-server (meestal de router).':'DHCP staat uit: je pc heeft een statisch adres dat iemand vast instelde.');
    const d=(L.dns||'').trim(), dOk=validV4(d)||/^[0-9a-f:]+$/i.test(d)&&d.includes(':');
    add(dOk, dOk?`Je DNS-server is ${d}.`+(validV4(d)&&L.gw&&d===L.gw.trim()?' Dat is je router: die geeft de vraag door.':''):'Je DNS-server is geen geldig adres.');
    if(!L.bits) add(false,'Beantwoord ook hoeveel bits een MAC-adres heeft.'); else add(L.bits.trim()==='48', L.bits.trim()==='48'?'Juist: 48 bits (6 × 8).':'Niet juist. Tel: 6 paren hexa, elk paar is 8 bits.');
  }
  if(n===3){
    if(!L.ns) return {empty:'Vul het IP-adres in dat nslookup gaf.'};
    const s=L.ns.trim(), v4=validV4(s), v6=/^[0-9a-f:]+$/i.test(s)&&s.includes(':');
    add(v4||v6, v4||v6?'Dit is een geldig adres.':'Dit is geen geldig IP-adres. Neem het adres na "Naam" of "Name".');
    if(v4){const c=classify(s).cat; add(c==='publiek', c==='publiek'?'Het is een publiek adres: de website staat op het internet.':'Dit is geen publiek adres. Nam je misschien het adres van de server bovenaan?');}
    if(!L.ver) add(false,'Kies of het een IPv4- of IPv6-adres is.'); else add((v4&&L.ver==='IPv4')||(v6&&L.ver==='IPv6'), (v4&&L.ver==='IPv4')||(v6&&L.ver==='IPv6')?`Juist: dit is ${L.ver}.`:'IPv4 heeft 4 getallen met punten, IPv6 hexa met dubbelpunten.');
  }
  if(n===4){
    if(!L.p127) return {empty:'Beantwoord de vraag over ping 127.0.0.1.'};
    add(L.p127==='Ja', L.p127==='Ja'?'Juist: 127.0.0.1 is je eigen pc (loopback), dus die antwoordt altijd.':'Vreemd: 127.0.0.1 is je eigen pc en antwoordt altijd. Controleer of je het commando juist typte.');
    if(L.pgw) add(null, L.pgw==='Ja'?'Je router antwoordt: de verbinding met je netwerk werkt.':L.pgw==='Nee'?'Je router antwoordde niet. Dat kan: sommige routers en schoolnetwerken blokkeren ping.':'Je hebt je gateway niet gepingd.');
    if(L.tr1){const t=L.tr1.trim(); if(!validV4(t)) add(false,'Het adres van hop 1 is geen geldig IPv4-adres.'); else if(L.gw&&t===L.gw.trim()) add(true,'Hop 1 is je eigen default gateway: al je verkeer naar buiten gaat eerst via je router.'); else add(null,'Hop 1 is niet je gateway uit opdracht 1. Dat kan in grote schoolnetwerken, maar kijk het even na.');}
    else add(false,'Vul ook het adres van hop 1 bij tracert in.');
  }
  if(n===5){
    if(L.novm==='1') return {skip:true};
    if(!L.vnat||!L.vbr) return {empty:'Vul beide adressen van je virtuele machine in, of vink aan dat je geen VM hebt.'};
    const a=L.vnat.trim(), b=L.vbr.trim(), mk=maskOf(L.mask);
    add(validV4(a)&&validV4(b), validV4(a)&&validV4(b)?'Beide adressen zijn geldig.':'Minstens één adres is geen geldig IPv4-adres.');
    if(validV4(a)) add(null, a.startsWith('10.0.2.')?'Het NAT-adres begint met 10.0.2: typisch voor VirtualBox-NAT.':'Bij NAT verwacht je een apart intern adres, zoals 10.0.2.15.');
    if(validV4(a)&&validV4(b)&&validV4(L.ip||'')&&mk){
      const bOk=sameNet(b,L.ip,mk.n), aSame=sameNet(a,L.ip,mk.n);
      add(bOk, bOk?'Het bridged-adres zit in hetzelfde netwerk als je pc: de VM is een apart toestel in je netwerk.':'Het bridged-adres zit niet in het netwerk van je pc. Stond de VM echt op bridged, en herstartte je het netwerk?');
      if(aSame) add(false,'Het NAT-adres zit in het netwerk van je pc. Dat hoort niet bij NAT: controleer de instelling.');
    } else if(validV4(b)) add(null,'Vul opdracht 1 in, dan vergelijkt de app het bridged-adres met je eigen netwerk.');
  }
  if(n===6){
    if(!L.uitleg) return {empty:'Schrijf je uitleg in het vak.'};
    const w=words(L.uitleg); add(w>=15, w>=15?`Je uitleg telt ${w} woorden. Je leerkracht beoordeelt de inhoud.`:`Je uitleg telt pas ${w} woorden. Schrijf minstens 15 woorden.`);
  }
  return {list:out};
}
function labStatus(n){const r=labChecks(n); if(r.skip) return 'skip'; if(r.empty) return 'todo'; return r.list.every(x=>x.ok!==false)?'ok':'warn';}
function labFb(n){
  const r=labChecks(n), el=document.getElementById('lab-fb-'+n); if(!el) return;
  el.hidden=false;
  if(r.skip){el.className='fb info'; el.innerHTML='<p class="fb-title">Overgeslagen</p><div class="fb-body"><p>Geen virtuele machine: deze opdracht telt niet mee.</p></div>'; return;}
  if(r.empty){el.className='fb info'; el.innerHTML=`<p class="fb-title">Even kijken</p><div class="fb-body"><p>${r.msg||r.empty}</p></div>`; return;}
  const good=r.list.every(x=>x.ok!==false);
  el.className='fb '+(good?'good':'bad');
  el.innerHTML=`<p class="fb-title">${good?'In orde':'Nog niet helemaal'}</p><div class="fb-body"><ul class="chk">${r.list.map(x=>`<li class="${x.ok===true?'y':x.ok===false?'n':'i'}"><b>${x.ok===true?'Klopt':x.ok===false?'Let op':'Info'}:</b> ${x.t}</li>`).join('')}</ul></div>`;
}
const LABOPS=[
  {n:1,t:'Je eigen adres',body:()=>`<div class="fields">${labField('ip','IPv4-adres',{ph:'bv. 192.168.1.10'})}${labField('mask','Subnetmasker',{ph:'bv. 255.255.255.0'})}${labField('gw','Standaardgateway',{ph:'bv. 192.168.1.1'})}</div><p class="sub">Reken nu zelf:</p><div class="fields">${labField('net','Jouw netwerkadres')}${labField('soort','Soort adres',{sel:['Privé','Publiek','Speciaal']})}</div>`},

  {n:6,t:'Leg uit',body:()=>`<p class="sub">${state.lab.novm==='1'?'Leg in je eigen woorden uit wat het verschil is tussen je IP-adres en je MAC-adres. Gebruik je eigen gegevens uit opdracht 1 en 2.':'Leg in je eigen woorden uit waarom je VM bij NAT en bij bridged een ander IP-adres kreeg.'} Schrijf minstens 15 woorden.</p>${labField('uitleg','Jouw uitleg',{area:true})}`}
];
function drawLab(){
  const card=$('#lab-card'), os=state.lab.os||'win';
  if(state.lab.view==='report') return drawLabReport();
  const chip=s=>`<span class="chip ${s==='ok'?'okc':s==='warn'?'warnc':''}">${s==='ok'?'In orde':s==='warn'?'Nakijken':s==='skip'?'Overgeslagen':'Te doen'}</span>`;
  card.innerHTML=`<p class="eyebrow">Praktijk</p><h1>Onderzoek je eigen netwerk</h1>
    <div class="intro"><p>Je gebruikt echte commando's op je eigen computer en vult in wat je ziet. De app controleert je gegevens en rekent mee. Aan het einde maak je een <b>verslag</b>: neem daar een screenshot van.</p></div>
    <div class="form-row" style="margin-top:8px">
      <div class="seg" role="radiogroup" aria-label="Besturingssysteem" id="lab-os">${Object.entries(LABOS).map(([k,v])=>`<button type="button" role="radio" aria-checked="${os===k}" aria-selected="${os===k}" data-os="${k}">${v}</button>`).join('')}</div>
    </div>
    ${LABOPS.map(o=>`<section class="op" aria-labelledby="op-h-${o.n}">
      <div class="op-head"><span class="op-n">${o.n}</span><h2 id="op-h-${o.n}">${o.t}${o.opt?' <span class="sub">(als je een VM hebt)</span>':''}</h2>${chip(labStatus(o.n))}</div>
      ${LABCMD[o.n]?`<p class="cmd">${LABCMD[o.n][os]}</p>`:''}
      ${o.body()}
      <div class="controls"><button type="button" class="secondary" data-chk="${o.n}">Controleer opdracht ${o.n}</button></div>
      <div class="fb" id="lab-fb-${o.n}" role="status" aria-live="polite" hidden></div>
    </section>`).join('')}
    <section class="op"><div class="op-head"><span class="op-n">✓</span><h2>Je verslag</h2></div>
      <div class="form-row">${labField('name','Voor- en achternaam')}${labField('klas','Klas')}<button type="button" class="primary" id="lab-rep">Maak mijn verslag</button></div>
      <p class="t-msg" id="lab-msg" hidden></p></section>`;
  card.querySelectorAll('[data-k]').forEach(i=>{const ev=i.tagName==='SELECT'?'change':'input'; i.addEventListener(ev,()=>{state.lab[i.dataset.k]=i.value; save();});});
  card.querySelector('#lab-novm').addEventListener('change',e=>{state.lab.novm=e.target.checked?'1':''; save(); drawLab();});
  card.querySelectorAll('#lab-os [data-os]').forEach(b=>b.addEventListener('click',()=>{state.lab.os=b.dataset.os; save(); drawLab();}));
  card.querySelectorAll('[data-chk]').forEach(b=>b.addEventListener('click',()=>{const n=+b.dataset.chk; labFb(n); const st=labStatus(n); const c=b.closest('.op').querySelector('.chip'); if(c){c.outerHTML=chip(st);} }));
  card.querySelector('#lab-rep').addEventListener('click',()=>{
    const msg=card.querySelector('#lab-msg');
    if(!(state.lab.name||'').trim()||!(state.lab.klas||'').trim()){msg.hidden=false; msg.textContent='Vul je naam en je klas in.'; return;}
    const todo=[1,2,3,4,6].filter(n=>labStatus(n)==='todo');
    if(todo.length){msg.hidden=false; msg.textContent=`Maak eerst opdracht ${todo.join(', ')} af.`; return;}
    state.lab.view='report'; state.lab.date=fmtDate(new Date()); save(); drawLab(); window.scrollTo({top:0});
  });
}
function drawLabReport(){
  const L=state.lab, card=$('#lab-card');
  const maskMac=m=>{const p=(m||'').trim().split(/[-:]/); return p.length===6?`${p[0]}-${p[1]}-••-••-${p[4]}-${p[5]}`:esc(m||'');};
  const cnt=n=>{const r=labChecks(n); if(r.skip) return 'overgeslagen'; if(r.empty) return 'niet ingevuld'; const l=r.list.filter(x=>x.ok!==null); return `${l.filter(x=>x.ok).length} van ${l.length} klopt`;};
  const rows=[
    ['1. Eigen adres',`IP ${esc(L.ip||'')} · masker ${esc(L.mask||'')} · gateway ${esc(L.gw||'')}<br>Netwerkadres: ${esc(L.net||'–')} · soort: ${esc(L.soort||'–')}`,cnt(1)],
    ['2. MAC, DHCP, DNS',`MAC ${maskMac(L.mac)} · DHCP: ${esc(L.dhcp||'–')} · DNS ${esc(L.dns||'')} · MAC-bits: ${esc(L.bits||'–')}`,cnt(2)],
    ['3. nslookup',`www.google.be = ${esc(L.ns||'')} (${esc(L.ver||'–')})`,cnt(3)],
    ['4. Ping en tracert',`127.0.0.1: ${esc(L.p127||'–')} · gateway: ${esc(L.pgw||'–')} · hop 1: ${esc(L.tr1||'–')}`,cnt(4)],
    ['5. VM',L.novm==='1'?'geen VM':`NAT ${esc(L.vnat||'')} · bridged ${esc(L.vbr||'')}`,cnt(5)]
  ];
  card.innerHTML=`<div class="cert">
    <div class="cert-head"><span class="logo" aria-hidden="true">10</span><div class="grow"><p class="name">Netwerklab · Praktijkverslag</p><p class="tag">Onderzoek je eigen netwerk</p></div></div>
    <div class="cert-who"><div><span class="k">Naam</span><b>${esc(L.name)}</b></div><div><span class="k">Klas</span><b>${esc(L.klas)}</b></div><div><span class="k">Datum</span><b>${L.date}</b></div><div><span class="k">Systeem</span><b>${LABOS[L.os||'win']}</b></div></div>
    <div class="tw"><table class="review"><thead><tr><th>Opdracht</th><th>Jouw gegevens</th><th>Controle</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
    <div><p class="sub" style="margin:0 0 4px"><b>6. Uitleg</b> (${L.novm==='1'?'IP- versus MAC-adres':'NAT versus bridged'}) · beoordeling door de leerkracht</p><p style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(L.uitleg||'')}</p></div>
  </div>
  <p class="sub" style="margin-top:12px">Neem een screenshot van dit verslag en lever het in bij je leerkracht.</p>
  <div class="after"><button type="button" class="secondary" id="lab-back">Terug naar de opdrachten</button></div>`;
  card.querySelector('#lab-back').addEventListener('click',()=>{state.lab.view=''; save(); drawLab();});
}

const MODES=[['theory','#mode-t','#theory'],['practice','#mode-p','#practice-mode'],['lab','#mode-l','#lab-mode'],['test','#mode-x','#test-mode']];
function setMode(m){
  if(state.mode==='test'&&m!=='test'&&test.phase==='run') test.leaves++;
  state.mode=m;
  MODES.forEach(([k,tab,panel])=>{const on=k===m; $(panel).hidden=!on; $(tab).setAttribute('aria-selected',on?'true':'false'); $(tab).tabIndex=on?0:-1;});
  save();
  if(m==='theory') drawChapter();
  if(m==='lab') drawLab();
  if(m==='test'){ if(test.phase==='done') test.phase='intro'; drawTest(); }
}

/* ---------- Nav ---------- */
function buildNav(){
  const groups={};
  Object.entries(M).forEach(([id,m])=>{(groups[m.group]=groups[m.group]||[]).push([id,m]);});
  $('#nav').innerHTML=Object.entries(groups).map(([g,items])=>`<div class="nav-group"><p class="nav-label">${g}</p>${items.map(([id,m])=>`<button type="button" class="nav-item" data-id="${id}"><span>${m.title}</span><span class="badge" data-badge="${id}"></span></button>`).join('')}</div>`).join('');
  $('#nav').querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{state.mod=b.dataset.id; state.lstep=0; state.view=state.seen[state.mod]?'practice':'learn'; save(); next(false);}));
}
function updStats(){
  let g=0,t=0;
  Object.keys(M).forEach(id=>{const s=state.stats[id]||{g:0,t:0}; g+=s.g; t+=s.t; const el=document.querySelector(`[data-badge="${id}"]`); if(el) el.textContent=s.t?`${s.g}/${s.t}`:'–';});
  $('#tot-g').textContent=g; $('#tot-t').textContent=t; $('#streak').textContent=state.streak;
}
function record(ok){
  const s=state.stats[state.mod]||(state.stats[state.mod]={g:0,t:0});
  s.t++; if(ok){s.g++;state.streak++;} else state.streak=0;
  save(); updStats();
}

/* ---------- Flow ---------- */
function fb(kind,title,msg){
  const f=$('#fb');
  if(!kind){f.hidden=true;f.innerHTML='';return;}
  f.className='fb '+kind; f.hidden=false;
  f.innerHTML=`<p class="fb-title">${title}</p><div class="fb-body">${msg}</div>`;
}
function controls(){
  const m=M[state.mod];
  const c=$('#check'); c.hidden=!!m.choice; c.disabled=state.done; c.className=state.done?'secondary':'primary';
  const hb=$('#hintbtn'); hb.hidden=!m.hintMax;
  if(m.hintMax){hb.disabled=state.done||state.hint>=m.hintMax; hb.textContent=state.hint?`Nog een hint (${state.hint}/${m.hintMax})`:'Geef een hint';}
  $('#solve').hidden=!!m.choice||state.done||state.tries<1;
  $('#next').className=state.done?'primary':'secondary';
}
function lock(){ $('#body').querySelectorAll('input.inp, button.bit').forEach(x=>x.disabled=true); }
function draw(){
  const m=M[state.mod];
  document.querySelectorAll('.nav-item').forEach(b=>b.setAttribute('aria-current',b.dataset.id===state.mod?'true':'false'));
  $('#q-title').textContent=m.title;
  const body=$('#body'); m.render(state.q,body);
  if(m.choice) body.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>submit(b.dataset.ans)));
  body.querySelectorAll('input.inp').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); state.done?next(true):submit();}}));
  const h=$('#hint'); h.hidden=true; h.innerHTML='';
  fb(null);
  $('#steps').innerHTML=m.steps.map(s=>`<li><span>${s}</span></li>`).join('');
  $('#ref').innerHTML=m.ref?`Hulp: ${m.ref}`:'';
  controls();
  setView(state.view);
}
function drawLearn(){
  const l=L[state.mod], n=l.steps.length;
  if(state.lstep>=n) state.lstep=n-1;
  const k=state.lstep;
  $('#intro').innerHTML=l.intro;
  $('#ex-label').textContent='Voorbeeld: '+l.label;
  $('#ex-count').textContent=`Stap ${k+1} van ${n}`;
  $('#dots').innerHTML=l.steps.map((_,i)=>`<span class="${i<=k?'done':''}"></span>`).join('');
  $('#ex-title').textContent=l.steps[k].t;
  $('#ex-vis').innerHTML=l.steps[k].h;
  $('#ex-prev').disabled=k===0;
  $('#ex-next').textContent=k===n-1?'Start met oefenen →':'Volgende stap →';
}
function setView(v){
  state.view=v;
  if(v==='learn'){state.seen[state.mod]=1; save();}
  const learn=v==='learn';
  $('#learn').hidden=!learn; $('#practice').hidden=learn;
  $('#tab-learn').setAttribute('aria-selected',learn?'true':'false');
  $('#tab-practice').setAttribute('aria-selected',learn?'false':'true');
  $('#tab-learn').tabIndex=learn?0:-1; $('#tab-practice').tabIndex=learn?-1:0;
  $('#eyebrow').textContent=`${M[state.mod].group} · ${learn?'uitleg':'oefenen'}`;
  if(learn) drawLearn();
}
function next(focus){
  const m=M[state.mod];
  state.q=m.gen(); state.done=false; state.recorded=false; state.tries=0; state.hint=0;
  draw();
  if(focus){const first=$('#body').querySelector('input.inp, button.bit, .choice'); if(first) first.focus();}
}
function submit(ans){
  if(state.done) return;
  const m=M[state.mod], body=$('#body');
  const r=m.check(state.q,body,ans);
  if(r.empty){fb('info','Even kijken',`<p>${r.msg}</p>`);return;}
  if(!state.recorded){record(r.ok);state.recorded=true;}
  state.tries++;
  if(r.ok){state.done=true; fb('good','Juist!',r.msg);}
  else{fb('bad','Nog niet',r.msg); if(m.choice) state.done=true;}
  if(m.choice){
    const right=m.correct(state.q);
    body.querySelectorAll('.choice').forEach(b=>{b.disabled=true; if(b.dataset.ans===right) b.classList.add('right'); else if(b.dataset.ans===ans) b.classList.add('wrong');});
  }
  if(state.done){lock(); $('#hint').hidden=true;}
  controls();
  if(state.done) $('#next').focus();
}
function hint(){
  const m=M[state.mod]; if(!m.hintMax||state.hint>=m.hintMax||state.done) return;
  state.hint++; const h=$('#hint'); h.hidden=false; h.innerHTML=m.hint(state.q,state.hint);
  controls();
}
function solve(){
  const m=M[state.mod];
  if(!state.recorded){record(false);state.recorded=true;}
  state.done=true; lock(); $('#hint').hidden=true;
  fb('info','Oplossing',m.solution(state.q));
  controls(); $('#next').focus();
}

$('#check').addEventListener('click',()=>submit());
$('#hintbtn').addEventListener('click',hint);
$('#solve').addEventListener('click',solve);
$('#next').addEventListener('click',()=>next(true));
$('#tab-learn').addEventListener('click',()=>setView('learn'));
$('#tab-practice').addEventListener('click',()=>setView('practice'));
$('#view-seg').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
  e.preventDefault(); const v=state.view==='learn'?'practice':'learn'; setView(v); $(v==='learn'?'#tab-learn':'#tab-practice').focus();
});
$('#ex-prev').addEventListener('click',()=>{ if(state.lstep>0){state.lstep--; drawLearn();} });
$('#ex-next').addEventListener('click',()=>{
  const n=L[state.mod].steps.length;
  if(state.lstep<n-1){state.lstep++; drawLearn(); return;}
  state.lstep=0; setView('practice');
  const first=$('#body').querySelector('input.inp, button.bit, .choice'); if(first) first.focus();
});
let resetArmed=null;
$('#reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(resetArmed){clearTimeout(resetArmed);resetArmed=null;state.stats={};state.streak=0;save();updStats();b.textContent='Scores gewist';setTimeout(()=>{b.textContent='Scores wissen';},1800);return;}
  b.textContent='Klik nogmaals om te wissen';
  resetArmed=setTimeout(()=>{resetArmed=null;b.textContent='Scores wissen';},3000);
});

$('#mode-x').addEventListener('click',()=>setMode('test'));
$('#mode-l').addEventListener('click',()=>setMode('lab'));
$('#mode-seg').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
  e.preventDefault();
  const i=MODES.findIndex(x=>x[0]===state.mode), j=(i+(e.key==='ArrowRight'?1:MODES.length-1))%MODES.length;
  setMode(MODES[j][0]); $(MODES[j][1]).focus();
});

buildNav(); buildToc(); updStats(); next(false); setMode(state.mode);
})();
