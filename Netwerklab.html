<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Netwerklab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#E4EAEE; --ink:#13233F; --ink-2:#4B5A6E; --line:#CDD6DC;
  --teal:#0B7A7C; --teal-ink:#FFFFFF; --teal-soft:#D5ECEC;
  --lamp:#F2A93B; --lamp-ink:#2E1C00; --lamp-glow:rgba(242,169,59,.40);
  --good:#256B43; --good-bg:#E1F1E7; --bad:#A83232; --bad-bg:#F7E3E1; --info-bg:#E6ECF4;
  --mono:'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  --sans:'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1422; --surface:#141F33; --surface-2:#1B2940; --ink:#E6ECF4; --ink-2:#9DAEC3; --line:#283954;
    --teal:#3CC0BD; --teal-ink:#05201F; --teal-soft:#123B3D;
    --lamp:#F4B24A; --lamp-ink:#2A1800; --lamp-glow:rgba(244,178,74,.30);
    --good:#6FD39A; --good-bg:#12301F; --bad:#F08A80; --bad-bg:#3A1B1B; --info-bg:#1B2940;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1422; --surface:#141F33; --surface-2:#1B2940; --ink:#E6ECF4; --ink-2:#9DAEC3; --line:#283954;
  --teal:#3CC0BD; --teal-ink:#05201F; --teal-soft:#123B3D;
  --lamp:#F4B24A; --lamp-ink:#2A1800; --lamp-glow:rgba(244,178,74,.30);
  --good:#6FD39A; --good-bg:#12301F; --bad:#F08A80; --bad-bg:#3A1B1B; --info-bg:#1B2940;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
code,.mono{font-family:var(--mono);font-weight:700}

.app{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-family:var(--mono);font-weight:700;background:var(--ink);color:var(--lamp);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.name{margin:0;font-weight:700;font-size:20px;letter-spacing:-.01em}
.tag{margin:0;color:var(--ink-2);font-size:14px}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--ink-2)}
.stat b{font-family:var(--mono);font-size:16px}
.streak b{color:var(--teal)}
.ghost{background:none;border:none;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 4px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.nav{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-label{margin:0 0 4px 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.nav-item{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px 12px;color:var(--ink);font-size:15px}
.nav-item:hover{background:var(--surface)}
.nav-item[aria-current="true"]{background:var(--teal-soft);border-color:var(--teal);font-weight:600}
.badge{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
h1{margin:0;font-size:clamp(22px,3vw,28px);font-weight:600;line-height:1.2;text-wrap:balance}
.body{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.prompt{margin:0;font-size:clamp(18px,2.4vw,22px);line-height:1.5}
.num{font-family:var(--mono);font-weight:700;background:var(--surface-2);padding:2px 8px;border-radius:6px;white-space:nowrap}
.sub{margin:0;color:var(--ink-2);font-size:15px}

.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.bit{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink-2);min-width:0}
button.bit:hover:not(:disabled){border-color:var(--teal)}
.bit .pv{font-size:13px;font-variant-numeric:tabular-nums}
.bit .bv{font-family:var(--mono);font-weight:700;font-size:clamp(20px,4.4vw,32px);line-height:1.1}
.bit.on{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink);box-shadow:0 0 0 4px var(--lamp-glow)}
.bits.bare .pv{visibility:hidden}
.bits.bare .bit.on{background:var(--surface-2);border-color:var(--line);color:var(--ink);box-shadow:none}
button.bit:disabled{cursor:default;opacity:1}
.live{margin:0;font-size:16px;color:var(--ink-2)}
.live b{color:var(--ink);font-size:20px}
.nibs{display:flex;align-items:stretch;gap:14px}
.nib{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:0}
.cut{width:3px;background:var(--ink-2);border-radius:2px;opacity:.5;flex:none}
.nib-labels{display:flex;gap:14px;font-size:13px;color:var(--ink-2)}
.nib-labels span{flex:1;text-align:center}
.nib-labels i{width:3px;flex:none}

.fields{display:flex;flex-wrap:wrap;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;flex:0 1 320px;min-width:0}
.fields .field{flex:1 1 220px}
.field span{font-size:14px;font-weight:500;color:var(--ink-2)}
.inp{font-family:var(--mono);font-size:22px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.inp:disabled{opacity:.7}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--teal)}
.addr{margin:0;font-family:var(--mono);font-weight:700;font-size:clamp(28px,6vw,46px);line-height:1.2;overflow-wrap:anywhere}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{flex:1 1 130px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:17px}
.choice:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}
.choice.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}

.controls{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
.primary,.secondary{padding:11px 18px;border-radius:10px;font-weight:600;font-size:15px;border:1.5px solid transparent}
.primary{background:var(--teal);color:var(--teal-ink)}
.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.secondary:hover:not(:disabled){border-color:var(--teal)}
.controls button:disabled{opacity:.45;cursor:not-allowed}

.hint{margin-top:16px;padding:16px;border-radius:12px;background:var(--info-bg);font-size:15px}
.hint p{margin:0 0 6px}
.fb{margin-top:16px;padding:16px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--info-bg)}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb-title{margin:0 0 4px;font-weight:700;font-size:17px}
.fb.good .fb-title{color:var(--good)}
.fb.bad .fb-title{color:var(--bad)}
.fb-body p{margin:0 0 6px}

.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
td.b{font-family:var(--mono);font-weight:700}
td.b.on{color:var(--teal)}
tr.hl td{background:var(--teal-soft);font-weight:600}
.trail{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.trail li.stop{font-weight:700}
.trail li.skip{color:var(--ink-2)}

.plan h2{margin:0 0 12px;font-size:18px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.steps li span{padding-top:4px}
.ref{margin:12px 0 0;font-size:14px;color:var(--ink-2)}
.ref:empty{display:none}

.card-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 20px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:4px;gap:4px}
.seg button{border:none;background:none;padding:8px 18px;border-radius:7px;font-weight:600;font-size:15px;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(19,35,63,.18)}
.intro{margin-top:16px;max-width:68ch;font-size:16px}
.intro p{margin:0 0 10px}
.intro ul{margin:0 0 10px;padding-left:20px}
.ex{margin-top:18px;border:1.5px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.ex-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ex-label{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.ex-count{margin:0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots span.done{background:var(--teal)}
.ex-title{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.ex-vis{display:flex;flex-direction:column;gap:12px;min-height:140px}
.say{margin:0;font-size:17px;max-width:68ch}
.result{margin:0;font-size:20px;font-weight:600}
.ex-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ex-nav button:disabled{opacity:.45;cursor:not-allowed}
.bit.unk .bv{opacity:.35}
.bits.plain .bit.on{background:var(--surface-2);border-color:var(--line);color:var(--ink);box-shadow:none}
.hexstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.hexstrip div{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.hexstrip b{display:block;font-family:var(--mono);font-size:26px;line-height:1.2}
.hexstrip span{font-size:13px;color:var(--ink-2)}
.hexstrip .lt{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.hexstrip .lt span{color:var(--lamp-ink)}
.split{display:inline-flex;flex-wrap:wrap}
.netp{background:var(--teal-soft);padding:2px 10px;border-radius:8px 0 0 8px}
.hostp{background:var(--lamp);color:var(--lamp-ink);padding:2px 10px;border-radius:0 8px 8px 0}
.legend{margin:0;display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}

.modes{align-self:flex-start}
.modes button{padding:10px 26px;font-size:16px}
.read{padding:32px}
.read h1{font-size:clamp(26px,3.4vw,34px)}
.read-body{max-width:70ch;margin-top:16px;font-size:17px;line-height:1.65}
.read-body h2{font-size:21px;line-height:1.3;margin:32px 0 10px;text-wrap:balance}
.read-body p{margin:0 0 14px}
.read-body ul,.read-body ol{margin:0 0 14px;padding-left:22px}
.read-body li{margin-bottom:6px}
.read-body code{font-weight:500;background:var(--surface-2);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.read-body th,.read-body td{white-space:normal;vertical-align:top}
.read-body td.b{white-space:nowrap}
.read-body table{font-size:15px}
.read-body .tw{margin:12px 0 18px}
.box{border-radius:12px;padding:16px 18px;margin:18px 0}
.box .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.box.onthoud{background:var(--teal-soft)}
.box.onthoud .lbl{color:var(--teal)}
.box.vgl{background:var(--surface-2)}
.box.vgl .lbl{color:var(--ink-2)}
.vis{margin:18px 0;display:flex;flex-direction:column;gap:12px}
.flow{display:flex;align-items:center;gap:10px}
.node{flex:1;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;text-align:center;line-height:1.45}
.node b{display:block;font-size:16px}
.node.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.arr{flex:none}
.arr::before{content:'→';font-size:24px;font-weight:700;color:var(--teal)}
.octs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.oct{background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;min-width:0}
.oct .k{display:block;font-size:12px;color:var(--teal);font-weight:600}
.oct b{display:block;font-family:var(--mono);font-size:26px}
.oct span:last-child{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.addr.small{font-size:clamp(16px,3vw,24px)}
.v6{display:flex;flex-direction:column;gap:8px}
.v6 div{background:var(--surface-2);border-radius:10px;padding:10px 14px}
.v6 .k{display:block;font-size:12px;font-weight:600;color:var(--teal);letter-spacing:.06em;text-transform:uppercase}
.v6 code{background:none;padding:0;font-weight:700;font-size:17px}
.quiz{margin-top:32px;border-top:1px solid var(--line);padding-top:22px;max-width:70ch}
.quiz h2{font-size:20px;margin:0 0 14px}
.qz{margin-bottom:20px}
.qq{font-weight:600;margin:0 0 8px}
.qz .choice{font-size:15px;padding:10px 14px;flex:1 1 180px;text-align:left}
.why{margin:8px 0 0;font-size:15px;padding:10px 14px;border-radius:10px}
.why.good{background:var(--good-bg)}
.why.bad{background:var(--bad-bg)}
.go{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:16px;max-width:70ch}
.go p{margin:0;font-weight:600;flex-basis:100%}
.ch-nav{margin-top:28px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.testcard{max-width:900px;margin:0 auto;width:100%}
.testcard h2{font-size:20px;margin:26px 0 6px}
.checklist{list-style:none;margin:12px 0 20px;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto 76px;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cnt{font-family:var(--mono);font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.checklist li.ok .chip{background:var(--good-bg);color:var(--good)}
.mini{padding:6px 12px;font-size:14px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.mini:hover{border-color:var(--teal)}
.form-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.inp.txt{font-family:var(--sans);font-size:18px}
.lockmsg{margin:0;padding:12px 16px;border-radius:10px;background:var(--info-bg);font-weight:500}
.teacher{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;font-size:15px}
.teacher summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.tbox{margin-top:12px;display:flex;flex-direction:column;gap:16px}
.tbox p{margin:0}
.choice.picked{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1.5px var(--teal)}
.t-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.t-sec{margin:16px 0 0;font-size:13px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.06em}
.t-msg{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:var(--info-bg)}
.cert{border:2px solid var(--ink);border-radius:16px;padding:24px;background:var(--surface);display:flex;flex-direction:column;gap:16px}
.cert-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cert-head .grow{flex:1;min-width:160px}
.cert-code{margin:0;font-size:13px;color:var(--ink-2);text-align:right}
.cert-code b{display:block;font-family:var(--mono);font-size:22px;color:var(--ink);letter-spacing:.12em}
.cert-who{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.cert-who div{background:var(--bg);border-radius:10px;padding:8px 12px;min-width:0}
.cert-who .k{display:block;font-size:12px;color:var(--ink-2)}
.cert-who b{font-size:16px;overflow-wrap:anywhere}
.cert-score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cert-score b{font-family:var(--mono);font-size:64px;line-height:1;color:var(--teal)}
.cert-score span{font-size:26px;font-weight:600}
.cert-score em{font-style:normal;color:var(--ink-2);font-size:18px}
.cert table{font-size:14px}
.cert th:last-child,.cert td:last-child{text-align:right}
.after{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.review td{white-space:normal;vertical-align:top}
.review td.res{font-weight:700;white-space:nowrap}
.review td.res.good{color:var(--good)}
.review td.res.bad{color:var(--bad)}
.vres{margin:0;padding:10px 14px;border-radius:10px}
.vres.good{background:var(--good-bg)}
.vres.bad{background:var(--bad-bg)}

pre.term{margin:0;background:#101A2E;color:#D7E3F4;font-family:var(--mono);font-size:14px;line-height:1.55;padding:14px 16px;border-radius:10px;overflow-x:auto;white-space:pre;max-width:100%}
.op{margin-top:28px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.op-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.op-head h2{margin:0;font-size:20px;flex:1;min-width:200px}
.op-head h2 .sub{font-size:14px;font-weight:400}
.op-n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-weight:700}
.cmd{margin:0;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:15px;line-height:1.55;max-width:75ch}
.cmd code,.op code{font-family:var(--mono);font-weight:600;background:var(--surface-2);padding:1px 6px;border-radius:5px}
.op .controls{margin-top:4px}
.field.wide{flex:1 1 100%;max-width:none}
textarea.inp{font-size:16px;line-height:1.5;resize:vertical;min-height:120px}
select.inp{font-size:17px;padding:10px 12px}
.chip.okc{background:var(--good-bg);color:var(--good)}
.chip.warnc{background:var(--bad-bg);color:var(--bad)}
.chk{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.chk li.i{color:var(--ink-2)}
.open-q{display:flex;flex-direction:column;gap:6px}
.open-a{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px}
.key{margin:6px 0 0;padding-left:18px;font-size:14px}
.key li{margin-bottom:4px}

@media (max-width:560px){
  .checklist li{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .cert{padding:16px}
  .cert-score b{font-size:48px}
  .flow{flex-direction:column;align-items:stretch}
  .arr{text-align:center}
  .arr::before{content:'↓'}
  .read{padding:18px}
  .oct b{font-size:20px}
  .oct span:last-child{font-size:11px}
}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .nav-group{flex-direction:row;gap:6px}
  .nav-label{display:none}
  .nav-item{white-space:nowrap;background:var(--surface);border-color:var(--line)}
  .card{padding:18px}
}
@media (max-width:440px){
  .bits,.nib{gap:4px}
  .bit .pv{font-size:11px}
  .nibs{gap:8px}
}
@media (prefers-reduced-motion:no-preference){
  .bit{transition:background-color .15s, box-shadow .15s, border-color .15s}
}

<script>
(function(){
const $=s=>document.querySelector(s);
const PV=[128,64,32,16,8,4,2,1];
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const bin8=n=>n.toString(2).padStart(8,'0');
const hx=n=>n.toString(16).toUpperCase();
const hx2=n=>hx(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parts=n=>PV.filter(p=>n&p);
const expr=n=>{const p=parts(n);return p.length?p.join(' + '):'0';};
const nibExpr=v=>{const p=[8,4,2,1].filter(x=>v&x);return p.length?p.join(' + '):'0';};
const HEXROW='A = 10 · B = 11 · C = 12 · D = 13 · E = 14 · F = 15';
const val=bits=>bits.reduce((s,b,i)=>s+(b?PV[i]:0),0);

function pastTable(n,rows){
  let rest=n; const out=[];
  for(const p of PV){
    const before=rest, fits=p<=rest; if(fits) rest-=p;
    out.push(`<tr><td>${p}</td><td>Past ${p} in ${before}?</td><td>${fits?'ja':'nee'}</td><td class="b ${fits?'on':''}">${fits?1:0}</td><td>${fits?`${before} − ${p} = ${rest}`:rest}</td></tr>`);
  }
  return `<div class="tw"><table><thead><tr><th>Getal</th><th>Vraag</th><th>Past?</th><th>Bit</th><th>Blijft over</th></tr></thead><tbody>${out.slice(0,rows).join('')}</tbody></table></div>`;
}
function staticBits(n,extra){
  return `<div class="bits ${extra||''}">${PV.map(p=>`<div class="bit ${n&p?'on':''}"><span class="pv">${p}</span><span class="bv">${n&p?1:0}</span></div>`).join('')}</div>`;
}
function nib(v){
  return `<div class="nib">${[8,4,2,1].map(p=>`<div class="bit ${v&p?'on':''}"><span class="pv">${p}</span><span class="bv">${v&p?1:0}</span></div>`).join('')}</div>`;
}
function field(id,label,opts){
  opts=opts||{};
  return `<label class="field" for="${id}"><span>${label}</span><input class="inp" id="${id}" autocomplete="off" autocapitalize="characters" spellcheck="false" ${opts.numeric?'inputmode="numeric"':''} ${opts.max?`maxlength="${opts.max}"`:''}></label>`;
}
const inputVal=(el,id)=>(el.querySelector('#'+id)||{value:''}).value.trim();

/* ---------- IPv4 helpers ---------- */
function rules(addr){
  const p=addr.split('.');
  const r1=p.length===4;
  const bad=p.find(x=>!/^\d+$/.test(x));
  const r3=bad===undefined;
  const big=r3?p.map(Number).find(n=>n>255):undefined;
  const r2=r3&&big===undefined;
  return {valid:r1&&r2&&r3, html:`<ul class="trail">
    <li class="${r1?'':'stop'}">Precies 4 getallen? ${r1?'Ja.':`Nee: er staan er ${p.length}.`}</li>
    <li class="${r3?'':'stop'}">Alleen cijfers? ${r3?'Ja.':`Nee: "${esc(bad)}" is geen getal.`}</li>
    <li class="${(r2||!r3)?'':'stop'}">Elk getal van 0 tot 255? ${!r3?'Kan je niet controleren.':r2?'Ja.':`Nee: ${big} is groter dan 255.`}</li>
  </ul>`};
}
function classify(addr){
  const p=addr.split('.'), trail=[];
  const r=rules(addr);
  let why='';
  if(!r.valid){
    const nums=p.map(Number);
    if(p.length!==4) why=`er staan ${p.length} getallen in plaats van 4`;
    else if(p.some(x=>!/^\d+$/.test(x))) why='er staat iets anders dan cijfers in';
    else why=`${nums.find(n=>n>255)} is groter dan 255`;
  }
  trail.push({a:r.valid?'Ja.':`Nee: ${why}.`,stop:!r.valid});
  if(!r.valid) return {cat:'ongeldig',trail};
  const [a,b]=p.map(Number);
  let sp='';
  if(a===127) sp='begint met 127, dat is loopback';
  else if(a===169&&b===254) sp='begint met 169.254, dat is APIPA';
  else if(addr==='0.0.0.0') sp='0.0.0.0 betekent "geen adres"';
  else if(addr==='255.255.255.255') sp='255.255.255.255 is broadcast naar iedereen';
  trail.push({a:sp?`Ja: ${sp}.`:'Nee.',stop:!!sp});
  if(sp) return {cat:'speciaal',trail};
  let pr='', no='Nee.';
  if(a===10) pr='begint met 10';
  else if(a===172&&b>=16&&b<=31) pr=`172.${b} ligt tussen 172.16 en 172.31`;
  else if(a===192&&b===168) pr='begint met 192.168';
  else if(a===172) no=`Nee: 172.${b} ligt niet tussen 172.16 en 172.31.`;
  else if(a===192) no='Nee: alleen 192.168 is privé.';
  else if(a===11||a===9) no='Nee: alleen 10 is privé.';
  trail.push({a:pr?`Ja: ${pr}.`:no,stop:!!pr});
  if(pr) return {cat:'prive',trail};
  trail.push({a:'Dan is het publiek.',stop:true});
  return {cat:'publiek',trail};
}
function trailHtml(t){
  const qs=['Is het geldig?','Is het speciaal?','Is het privé?','Geen van allemaal?'];
  return `<ol class="trail">${qs.map((q,i)=>{const s=t[i]; if(!s) return `<li class="skip">${q} Niet meer nodig.</li>`; return `<li class="${s.stop?'stop':''}">${q} ${s.a}</li>`;}).join('')}</ol>`;
}
const KL=[['A',1,126,'grote netwerken'],['B',128,191,'middelgrote netwerken'],['C',192,223,'kleine netwerken'],['D',224,239,'multicast'],['E',240,255,'experimenteel']];
const CATNAME={ongeldig:'ongeldig',speciaal:'speciaal',prive:'privé',publiek:'publiek'};

/* ---------- Modules ---------- */
const M={
  dec2bin:{group:'Talstelsels',title:'Decimaal → binair',
    steps:['Schrijf de rij op: <b>128 · 64 · 32 · 16 · 8 · 4 · 2 · 1</b>','Vraag bij elk getal: past het nog in wat overblijft? <b>Ja</b> → zet het lampje aan (1) en trek het af. <b>Nee</b> → laat het uit (0).','Controleer: tel de lampjes die aan staan op. Kom je op je startgetal uit? Dan is het juist.'],
    gen:()=>({n:rand(1,255),bits:[0,0,0,0,0,0,0,0]}),
    render(q,el){
      el.innerHTML=`<p class="prompt">Zet <span class="num">${q.n}</span> om naar binair.</p>
        <p class="sub">Klik op een lampje om het aan (1) of uit (0) te zetten.</p>
        <div class="bits" role="group" aria-label="Acht bits">${PV.map((p,i)=>`<button type="button" class="bit" data-i="${i}" aria-pressed="false" aria-label="Plaatswaarde ${p}"><span class="pv">${p}</span><span class="bv">0</span></button>`).join('')}</div>
        <p class="live">Som van de lampjes die aan staan: <b id="sum" class="mono">0</b></p>`;
      el.querySelectorAll('button.bit').forEach(b=>b.addEventListener('click',()=>{
        if(b.disabled) return;
        const i=+b.dataset.i; q.bits[i]^=1;
        b.classList.toggle('on',!!q.bits[i]); b.setAttribute('aria-pressed',q.bits[i]?'true':'false');
        b.querySelector('.bv').textContent=q.bits[i];
        el.querySelector('#sum').textContent=val(q.bits);
      }));
    },
    check(q){
      const v=val(q.bits);
      if(v===0) return {empty:true,msg:'Zet eerst de lampjes aan die je nodig hebt.'};
      if(v===q.n) return {ok:true,msg:`${q.n} = <code>${bin8(q.n)}</code>. Controle: ${expr(q.n)} = ${q.n}.`};
      return {ok:false,msg:`Jouw lampjes zijn samen <b>${v}</b>, maar je zoekt <b>${q.n}</b>. ${v>q.n?'Dat is te veel.':'Dat is te weinig.'} Probeer opnieuw of vraag een hint.`};
    },
    hintMax:8,
    hint:(q,l)=>`<p>Stel bij elk getal de vraag: past het nog? (stap ${l} van 8)</p>${pastTable(q.n,l)}`,
    solution:q=>`<p>${q.n} = <code>${bin8(q.n)}</code> (${expr(q.n)})</p>${pastTable(q.n,8)}`
  },

  bin2dec:{group:'Talstelsels',title:'Binair → decimaal',
    steps:['Schrijf <b>128 … 1</b> boven de bits.','Kijk waar een <b>1</b> staat.','Tel die getallen op.'],
    gen:()=>({n:rand(1,255)}),
    render(q,el){
      el.innerHTML=`<p class="prompt">Welk decimaal getal is <span class="num">${bin8(q.n)}</span>?</p>
        ${staticBits(q.n,state.hard?'bare':'')}
        <label class="toggle"><input type="checkbox" id="hard" ${state.hard?'checked':''}> Moeilijker: zonder hulp (plaatswaarden verbergen)</label>
        ${field('ans','Jouw antwoord (decimaal)',{numeric:true,max:3})}`;
      el.querySelector('#hard').addEventListener('change',e=>{state.hard=e.target.checked;el.querySelector('.bits').classList.toggle('bare',state.hard);save();});
    },
    check(q,el){
      const s=inputVal(el,'ans');
      if(!/^\d+$/.test(s)) return {empty:true,msg:'Typ een getal in het vak.'};
      if(+s===q.n) return {ok:true,msg:`<code>${bin8(q.n)}</code> = ${expr(q.n)} = <b>${q.n}</b>.`};
      return {ok:false,msg:'Tel alleen de getallen op die boven een <b>1</b> staan. Probeer opnieuw.'};
    },
    hintMax:1,
    hint:q=>`<p>Boven de enen staan: <b>${parts(q.n).join(', ')}</b>. Tel ze op.</p>`,
    solution:q=>`<p><code>${bin8(q.n)}</code> = ${expr(q.n)} = <b>${q.n}</b></p>`
  },

  hexdigit:{group:'Talstelsels',title:'Hexa-cijfers',
    steps:['Hexa heeft 16 cijfers. Na 9 komen letters: <b>A = 10, B = 11, C = 12, D = 13, E = 14, F = 15</b>.','Ezelsbrug: A is de eerste letter en staat voor 10. Tel daarna gewoon verder.','Let op: <b>10 in hexa is 16</b> in decimaal. Na F (15) komt 10.'],
    gen(){const t=pick(['toDec','toDec','toHex','toHex','ten']); if(t==='ten') return {t,v:16}; if(t==='toDec') return {t,v:Math.random()<.8?rand(10,15):rand(0,9)}; return {t,v:rand(10,15)};},
    render(q,el){
      const p=q.t==='toDec'?`Welk decimaal getal is het hex-cijfer <span class="num">${hx(q.v)}</span>?`
        :q.t==='toHex'?`Welk hex-cijfer staat voor <span class="num">${q.v}</span>?`
        :`Welk decimaal getal is <span class="num">10</span> in hexa?`;
      el.innerHTML=`<p class="prompt">${p}</p>${field('ans',q.t==='toHex'?'Hex-cijfer':'Decimaal getal',{numeric:q.t!=='toHex',max:2})}`;
    },
    check(q,el){
      const s=inputVal(el,'ans').toUpperCase();
      if(!s) return {empty:true,msg:'Typ je antwoord in het vak.'};
      if(q.t==='toHex') return s===hx(q.v)?{ok:true,msg:`${q.v} = <b>${hx(q.v)}</b>.`}:{ok:false,msg:'Tel vanaf A = 10 verder: B = 11, C = 12, …'};
      if(/^\d+$/.test(s)&&+s===q.v) return {ok:true,msg:q.t==='ten'?'10 in hexa = <b>16</b>. Na F (15) komt 10.':`${hx(q.v)} = <b>${q.v}</b>.`};
      return {ok:false,msg:q.t==='ten'?'Tip: tel in hexa verder na F. F is 15.':'Tel vanaf A = 10 verder: B = 11, C = 12, …'};
    },
    hintMax:1,
    hint:q=>q.t==='ten'?'<p>Tel in hexa: … D, E, F, 10. F is 15, dus 10 komt net daarna.</p>':`<p>${HEXROW}</p>`,
    solution:q=>q.t==='toHex'?`<p>${q.v} = <b>${hx(q.v)}</b></p>`:q.t==='ten'?'<p>10 in hexa = <b>16</b> (F = 15, daarna komt 10)</p>':`<p>${hx(q.v)} = <b>${q.v}</b></p>`
  },

  bin2hex:{group:'Talstelsels',title:'Binair → hexa',
    steps:['Knip de 8 bits in <b>2 stukken van 4</b>.','Reken elk stuk uit met <b>8 – 4 – 2 – 1</b>.','Zet elk getal om naar één hex-cijfer.'],
    ref:HEXROW,
    gen:()=>({n:rand(1,255)}),
    render(q,el){
      const hi=q.n>>4, lo=q.n&15;
      el.innerHTML=`<p class="prompt">Zet <span class="num">${bin8(q.n)}</span> om naar hexa.</p>
        <div class="nib-labels" aria-hidden="true"><span>Stuk 1</span><i></i><span>Stuk 2</span></div>
        <div class="nibs">${nib(hi)}<span class="cut" aria-hidden="true"></span>${nib(lo)}</div>
        ${field('ans','Jouw antwoord (hexa, 2 cijfers)',{max:2})}`;
    },
    check(q,el){
      const s=inputVal(el,'ans').toUpperCase();
      if(!/^[0-9A-F]{1,2}$/.test(s)) return {empty:true,msg:'Typ 1 of 2 hex-cijfers (0–9 en A–F).'};
      const hi=q.n>>4, lo=q.n&15, b=bin8(q.n);
      if(parseInt(s,16)===q.n) return {ok:true,msg:`<code>${b.slice(0,4)} | ${b.slice(4)}</code> → ${hi} en ${lo} → <b>${hx2(q.n)}</b>.`};
      return {ok:false,msg:'Reken elk stuk van 4 bits apart uit met 8 – 4 – 2 – 1. Probeer opnieuw.'};
    },
    hintMax:2,
    hint(q,l){const hi=q.n>>4, lo=q.n&15, b=bin8(q.n);
      if(l===1) return `<p>Stuk 1: <code>${b.slice(0,4)}</code> = ${nibExpr(hi)} = ?<br>Stuk 2: <code>${b.slice(4)}</code> = ${nibExpr(lo)} = ?</p>`;
      return `<p>Stuk 1 = <b>${hi}</b>, stuk 2 = <b>${lo}</b>. Zoek nu het hex-cijfer:</p><p>${HEXROW}</p>`;},
    solution(q){const hi=q.n>>4, lo=q.n&15, b=bin8(q.n); return `<p><code>${b.slice(0,4)} | ${b.slice(4)}</code> → ${nibExpr(hi)} = ${hi} en ${nibExpr(lo)} = ${lo} → <b>${hx2(q.n)}</b></p>`;}
  },

  dec2hex:{group:'Talstelsels',title:'Decimaal → hexa',
    steps:['Zet het getal om naar <b>binair</b> (de aftrekmethode).','Knip in <b>2 stukken van 4</b> bits.','Zet elk stuk om naar <b>één hex-cijfer</b>.'],
    ref:HEXROW,
    gen:()=>({n:rand(16,255)}),
    render(q,el){
      el.innerHTML=`<p class="prompt">Zet <span class="num">${q.n}</span> om naar hexa. Ga via binair.</p>
        <div class="fields">${field('ansb','Stap 1 · binair (8 bits)',{numeric:true,max:8})}${field('ansh','Stap 2 en 3 · hexa',{max:2})}</div>`;
    },
    check(q,el){
      const b=inputVal(el,'ansb'), h=inputVal(el,'ansh').toUpperCase();
      if(!b&&!h) return {empty:true,msg:'Vul eerst stap 1 (binair) in, en daarna de hexa.'};
      const bOk=/^[01]{1,8}$/.test(b)&&parseInt(b,2)===q.n;
      const hOk=/^[0-9A-F]{1,2}$/.test(h)&&parseInt(h,16)===q.n;
      const path=`${q.n} → <code>${bin8(q.n)}</code> → <code>${bin8(q.n).slice(0,4)} | ${bin8(q.n).slice(4)}</code> → <b>${hx2(q.n)}</b>`;
      if(hOk&&(bOk||!b)) return {ok:true,msg:`${path}.${!b?' Vul de volgende keer ook stap 1 in: zo zie je hoe je eraan komt.':''}`};
      const lines=[];
      if(!b) lines.push('Stap 1 (binair) is nog leeg.');
      else if(bOk) lines.push('Stap 1 (binair) is juist.');
      else if(/^[01]+$/.test(b)) lines.push(`Stap 1 klopt nog niet: jouw bits zijn samen ${parseInt(b,2)}, je zoekt ${q.n}.`);
      else lines.push('Stap 1 mag alleen nullen en enen bevatten.');
      if(!h) lines.push('De hexa is nog leeg.');
      else if(!hOk) lines.push('De hexa klopt nog niet. Knip je binaire getal in 2 stukken van 4 en reken elk stuk uit.');

/* ---------- Uitleg: theorie + uitgewerkte voorbeelden ---------- */
function bitsPartial(n,k){
  return `<div class="bits">${PV.map((p,i)=>i<k?`<div class="bit ${n&p?'on':''}"><span class="pv">${p}</span><span class="bv">${n&p?1:0}</span></div>`:`<div class="bit unk"><span class="pv">${p}</span><span class="bv">?</span></div>`).join('')}</div>`;
}
function pastStep(n,k){let rest=n; for(let i=0;i<k;i++){ if(PV[i]<=rest) rest-=PV[i]; } const p=PV[k], fits=p<=rest; return {p,before:rest,fits,after:fits?rest-p:rest};}
function nibsView(n){const hi=n>>4, lo=n&15; return `<div class="nib-labels" aria-hidden="true"><span>Stuk 1</span><i></i><span>Stuk 2</span></div><div class="nibs">${nib(hi)}<span class="cut" aria-hidden="true"></span>${nib(lo)}</div>`;}
function hexStrip(vals,hl){return `<div class="hexstrip">${vals.map(v=>`<div class="${hl&&hl.includes(v)?'lt':''}"><b>${hx(v)}</b><span>= ${v}</span></div>`).join('')}</div>`;}
function splitAddr(net,host){return `<p class="addr"><span class="split"><span class="netp">${net}</span><span class="hostp">.${host}</span></span></p>`;}
const LEG='<p class="legend"><span><i style="background:var(--teal-soft)"></i>netwerkdeel (de straat)</span><span><i style="background:var(--lamp)"></i>hostdeel (het huisnummer)</span></p>';
function klTable(k){return `<div class="tw"><table><thead><tr><th>Klasse</th><th>Eerste getal</th><th>Gebruik</th></tr></thead><tbody>${KL.map(r=>`<tr class="${r[0]===k?'hl':''}"><td>${r[0]}</td><td>${r[1]} – ${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`;}
function soortStep(a){const c=classify(a); return {t:a, h:`<p class="addr">${a}</p>${trailHtml(c.trail)}<p class="result">→ ${CATNAME[c.cat]}</p>`};}
function geldigStep(a){const r=rules(a); return {t:a, h:`<p class="addr">${esc(a)}</p>${r.html}<p class="result">→ ${r.valid?'geldig':'ongeldig'}</p>`};}

function dec2binSteps(n){
  const s=[{t:'Schrijf de rij op',h:`<p class="say">Elk lampje heeft een vaste waarde. We weten nog niet welke lampjes aan moeten, dus staat er overal een vraagteken.</p>${bitsPartial(n,0)}<p class="say">We beginnen links, bij het grootste lampje: 128.</p>`}];
  PV.forEach((p,k)=>{const x=pastStep(n,k);
    s.push({t:`Past ${p} in ${x.before}?`,h:`<p class="say">${x.fits?`<b>Ja.</b> Lampje ${p} gaat aan (1). We trekken af: ${x.before} − ${p} = <b>${x.after}</b>. Daarmee rekenen we verder.`:`<b>Nee.</b> ${p} is groter dan ${x.before}. Lampje ${p} blijft uit (0). Er blijft nog steeds <b>${x.before}</b> over.`}</p>${bitsPartial(n,k+1)}`});
  });
  s.push({t:'Controleer je antwoord',h:`<p class="say">Tel de lampjes die aan staan op: ${expr(n)} = <b>${n}</b>. Dat is ons startgetal, dus het klopt!</p>${staticBits(n)}<p class="result">${n} = <code>${bin8(n)}</code></p>`});
  return s;
}

<p>Op een Windows-pc open je de opdrachtprompt en typ je <code>ipconfig</code>. Op Linux of macOS typ je <code>ip a</code> in de terminal. Zoek de regel met <b>IPv4-adres</b>. Grote kans dat het begint met 192.168 of met 10. Waarom? Dat ontdek je in hoofdstuk 6.</p>
${ONT('Elk toestel in een netwerk heeft een IP-adres nodig, net zoals elk huis een postadres heeft.')}`,
quiz:[{q:'Waarom heeft een toestel een IP-adres nodig?',o:['Zodat data weet waar het naartoe moet','Om sneller te kunnen surfen','Om de batterij te sparen'],a:0,w:'Het IP-adres is het postadres van het toestel. Zonder adres weet een pakketje niet waar het moet aankomen.'},
{q:'Wat is het internet?',o:['Eén grote computer van Google','Een netwerk van netwerken','Hetzelfde als wifi'],a:1,w:'Het internet koppelt miljoenen kleinere netwerken aan elkaar. Wifi is maar één manier om een toestel met een netwerk te verbinden.'}],
practice:[]},

{short:'Hoe telt een computer?',title:'Hoe telt een computer? Talstelsels',
html:`<p>Om IP-adressen te begrijpen, moet je eerst weten hoe een computer telt. Dat doet hij namelijk anders dan wij.</p>
<h2>Wij tellen decimaal</h2>
<p>Wij tellen met <b>10 cijfers</b>: 0 tot 9. Dat heet het <b>decimale</b> talstelsel (deci = tien). Het aantal cijfers in een talstelsel heet het <b>grondtal</b>.</p>
<p>De plaats van een cijfer bepaalt hoeveel het waard is. In 245 is de 2 geen twee, maar tweehonderd:</p>
<div class="tw"><table><thead><tr><th>Honderdtallen</th><th>Tientallen</th><th>Eenheden</th></tr></thead><tbody><tr><td class="b">2</td><td class="b">4</td><td class="b">5</td></tr><tr><td>2 × 100 = 200</td><td>4 × 10 = 40</td><td>5 × 1 = 5</td></tr></tbody></table></div>
<p>Samen: 200 + 40 + 5 = 245. Elke plaats naar links is <b>10 keer</b> zoveel waard.</p>
<h2>Een computer telt binair</h2>
<p>Een computer bestaat uit miljarden piepkleine schakelaars. Een schakelaar kent maar twee standen: <b>aan</b> of <b>uit</b>. Daarom telt een computer met maar <b>2 cijfers</b>: 1 (aan) en 0 (uit). Dat heet <b>binair</b> (bi = twee).</p>
<p>Binair werkt precies zoals decimaal, alleen is elke plaats naar links <b>2 keer</b> zoveel waard in plaats van 10 keer. Zo krijg je de rij 1, 2, 4, 8, 16, 32, 64, 128:</p>
<div class="vis">${staticBits(245)}<p class="say">De lampjes die aan staan: 128 + 64 + 32 + 16 + 4 + 1 = <b>245</b>. Binair schrijf je 245 dus als <code>11110101</code>.</p></div>
<ul><li>Eén 0 of 1 heet een <b>bit</b>.</li><li>8 bits samen heten een <b>byte</b>. In een IP-adres noemen we zo'n groepje van 8 bits een <b>octet</b>.</li><li>Met 8 bits kan je 256 combinaties maken: van 0 (<code>00000000</code>) tot 255 (<code>11111111</code>).</li></ul>
${VGL('Een rij van 8 lampjes. Elk lampje heeft een vaste waarde. Welke lampjes aan staan, bepaalt het getal.')}
<h2>Hexadecimaal: korter schrijven</h2>
<p>Lange rijen enen en nullen zijn lastig om te lezen. Daarom gebruiken informatici ook het <b>hexadecimale</b> talstelsel, kort <b>hexa</b>, met <b>16 cijfers</b>. Na 9 zijn de gewone cijfers op, dus gebruikt hexa letters:</p>
<div class="vis">${hexStrip([10,11,12,13,14,15],[10,11,12,13,14,15])}</div>
<p>Het handige is dat één hex-cijfer staat voor precies <b>4 bits</b>. Een byte van 8 bits schrijf je dus met 2 hex-cijfers: <code>11111111</code> wordt gewoon <b>FF</b>. Je ziet hexa in MAC-adressen, IPv6-adressen en kleurcodes zoals #FF8800.</p>
<h2>Drie keer hetzelfde getal</h2>
<div class="tw"><table><thead><tr><th>Talstelsel</th><th>Grondtal</th><th>Cijfers</th><th>245 geschreven</th></tr></thead><tbody><tr><td>Decimaal</td><td>10</td><td>0 – 9</td><td class="b">245</td></tr><tr><td>Binair</td><td>2</td><td>0 en 1</td><td class="b">11110101</td></tr><tr><td>Hexadecimaal</td><td>16</td><td>0 – 9 en A – F</td><td class="b">F5</td></tr></tbody></table></div>
<h2>Omzetten: de stappenplannen</h2>
<ul><li><b>Decimaal → binair:</b> loop de rij 128 … 1 af en vraag telkens: past het nog? Ja: schrijf 1 en trek af. Nee: schrijf 0.</li><li><b>Binair → decimaal:</b> tel de waarden op waar een 1 staat.</li><li><b>Binair → hexa:</b> knip in 2 stukken van 4 bits en reken elk stuk uit met 8 – 4 – 2 – 1.</li><li><b>Decimaal → hexa:</b> eerst naar binair, dan knippen.</li></ul>
<p>Bij elke oefening in het onderdeel <b>Oefenen</b> vind je een uitleg met een voorbeeld dat je stap voor stap doorklikt.</p>
${ONT('Binair heeft 2 cijfers, en elke plaats is 2 keer zoveel waard. De rij is <b>128 · 64 · 32 · 16 · 8 · 4 · 2 · 1</b>. Hexa heeft 16 cijfers (A = 10 tot F = 15), en één hex-cijfer is 4 bits.')}`,
quiz:[{q:'Wat is het grootste getal dat je met 8 bits kan maken?',o:['128','255','256','8'],a:1,w:'Alle 8 lampjes aan: 128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = 255. Er zijn wel 256 combinaties, maar je begint te tellen bij 0.'},
{q:'Voor welk getal staat B in hexa?',o:['10','11','12','2'],a:1,w:'A = 10, dus B = 11.'},
{q:'Wat is 00000110 in decimaal?',o:['110','3','6','12'],a:2,w:'De enen staan onder 4 en 2: 4 + 2 = 6.'}],
practice:['dec2bin','bin2dec','hexdigit','bin2hex','dec2hex']},

{short:'Het IPv4-adres',title:'Het IPv4-adres',
html:`<p><b>IP</b> staat voor <i>Internet Protocol</i>: de afspraken die bepalen hoe toestellen elkaar op een netwerk terugvinden. <b>IPv4</b> is versie 4 van die afspraken. Het bestaat al sinds 1981 en is nog altijd de meest gebruikte versie.</p>
<h2>Hoe ziet een IPv4-adres eruit?</h2>
<p>Een IPv4-adres is eigenlijk een rij van <b>32 bits</b>. Voor een computer is dat prima, maar voor mensen is een rij van 32 enen en nullen onleesbaar. Daarom knippen we het adres in <b>4 stukken van 8 bits</b>, de 4 octetten. Elk stuk schrijven we als een gewoon getal, met een punt ertussen.</p>
<div class="vis">${octs('192.168.1.10')}<p class="say">Voor jou: <b>192.168.1.10</b>. Voor de computer: <code>11000000101010000000000100001010</code></p></div>
<p>Deze schrijfwijze heet <i>dotted decimal</i>: decimale getallen met punten.</p>
<h2>Geldig of ongeldig?</h2>
<p>Elk getal bestaat uit 8 bits, dus het kan nooit groter zijn dan 255. Een adres is alleen geldig als het aan deze 3 regels voldoet:</p>
<ol><li>Precies <b>4 getallen</b>, gescheiden door 3 punten.</li><li>Elk getal ligt tussen <b>0 en 255</b>.</li><li>Alleen <b>cijfers</b>, geen letters of andere tekens.</li></ol>
<div class="tw"><table><thead><tr><th>Adres</th><th>Oordeel</th><th>Waarom</th></tr></thead><tbody>
<tr><td class="b">10.0.0.1</td><td>geldig</td><td>voldoet aan de 3 regels</td></tr>
<tr><td class="b">192.168.1.256</td><td>ongeldig</td><td>256 is groter dan 255</td></tr>
<tr><td class="b">172.16.5</td><td>ongeldig</td><td>maar 3 getallen</td></tr>
<tr><td class="b">192.168.01.a</td><td>ongeldig</td><td>bevat een letter</td></tr></tbody></table></div>
<h2>Te weinig adressen</h2>
<p>Met 32 bits kan je 2<sup>32</sup> combinaties maken: ongeveer <b>4,3 miljard</b> adressen. Dat klinkt veel, maar er zijn veel meer toestellen online: gsm's, laptops, smart-tv's, slimme lampen, spelconsoles … Voor dit probleem bestaan twee oplossingen: <b>NAT</b> (hoofdstuk 7) en <b>IPv6</b> (hoofdstuk 8).</p>
${ONT('IPv4 = 32 bits = 4 getallen van 0 tot 255, gescheiden door punten.')}`,
quiz:[{q:'Hoeveel bits heeft een IPv4-adres?',o:['8','32','128','4'],a:1,w:'4 octetten × 8 bits = 32 bits.'},
{q:'Welk adres is geldig?',o:['10.0.0.256','172.16.5','192.168.0.1','8.8.8.8.8'],a:2,w:'192.168.0.1 heeft 4 getallen, allemaal tussen 0 en 255. De andere hebben een getal boven 255, te weinig of te veel getallen.'}],
practice:['geldig']},

{short:'Netwerkdeel en hostdeel',title:'Netwerkdeel, hostdeel en subnetmasker',
html:`<p>Een IP-adres bestaat uit twee delen, net zoals een postadres uit een straat en een huisnummer bestaat.</p>
<div class="vis">${splitAddr('192.168.1','10')}${LEG}</div>
<ul><li>Het <b>netwerkdeel</b> zegt in welk netwerk het toestel zit: de straat.</li><li>Het <b>hostdeel</b> zegt welk toestel het is binnen dat netwerk: het huisnummer. <i>Host</i> is het vakwoord voor een toestel in een netwerk.</li></ul>
<p>Toestellen met hetzelfde netwerkdeel zitten in hetzelfde netwerk en kunnen rechtstreeks met elkaar praten. Moet een pakketje naar een ander netwerk, dan gaat het via de router.</p>
<h2>Het subnetmasker toont de grens</h2>
<p>Aan het adres zelf zie je niet waar het netwerkdeel stopt. Daarvoor dient het <b>subnetmasker</b>. Het ziet eruit als een IP-adres, bijvoorbeeld <code>255.255.255.0</code>.</p>
<p>De regel is eenvoudig. Waar het masker binair een <b>1</b> heeft, hoort dat stukje bij het netwerk. Waar het een <b>0</b> heeft, hoort het bij de host. 255 is <code>11111111</code> (allemaal enen) en 0 is <code>00000000</code>.</p>
<div class="tw"><table><thead><tr><th></th><th>Netwerkdeel</th><th>Hostdeel</th></tr></thead><tbody><tr><td>IP-adres</td><td class="b">192.168.1</td><td class="b">.10</td></tr><tr><td>Subnetmasker</td><td class="b">255.255.255</td><td class="b">.0</td></tr><tr><td>Masker binair</td><td class="b">11111111.11111111.11111111</td><td class="b">.00000000</td></tr></tbody></table></div>
<h2>De korte schrijfwijze: /24</h2>
<p>In plaats van het hele masker te schrijven, kan je ook gewoon de enen tellen. <code>255.255.255.0</code> heeft 3 × 8 = 24 enen, dus schrijf je <b>/24</b> achter het adres: <code>192.168.1.10/24</code>. Dit heet de <b>CIDR-notatie</b>.</p>
<div class="tw"><table><thead><tr><th>Masker</th><th>Kort</th><th>Netwerkdeel</th></tr></thead><tbody><tr><td class="b">255.0.0.0</td><td>/8</td><td>het eerste getal</td></tr><tr><td class="b">255.255.0.0</td><td>/16</td><td>de eerste 2 getallen</td></tr><tr><td class="b">255.255.255.0</td><td>/24</td><td>de eerste 3 getallen</td></tr></tbody></table></div>
<h2>Twee gereserveerde adressen</h2>
<p>In elk netwerk zijn twee adressen niet bedoeld voor toestellen:</p>
<ul><li>Het <b>netwerkadres</b>: het hostdeel is 0, bijvoorbeeld <code>192.168.1.0</code>. Dit is de naam van het netwerk zelf.</li><li>Het <b>broadcastadres</b>: het hostdeel is 255, bijvoorbeeld <code>192.168.1.255</code>. Een bericht naar dit adres gaat naar alle toestellen in het netwerk tegelijk.</li></ul>
<p>Alles daartussen is voor toestellen: <code>192.168.1.1</code> tot <code>192.168.1.254</code>. Dat zijn 256 − 2 = <b>254</b> adressen.</p>
${ONT('Bij /24 zijn de eerste 3 getallen het netwerkdeel. Het netwerkadres eindigt op .0, het broadcastadres op .255, en toestellen krijgen .1 tot .254.')}`,
quiz:[{q:'Wat betekent /24?',o:['Er passen 24 toestellen in het netwerk','De eerste 24 bits zijn het netwerkdeel','Het adres is 24 bits lang'],a:1,w:'/24 telt de enen in het subnetmasker: 24 enen = 255.255.255.0, dus de eerste 3 getallen zijn het netwerkdeel.'},
{q:'Wat is het broadcastadres van 10.0.3.7/24?',o:['10.0.3.0','10.0.3.255','10.255.255.255'],a:1,w:'Houd het netwerkdeel (10.0.3) en zet 255 achteraan.'}],
practice:['netwerk']},

{short:'Soorten adressen',title:'Privé, publiek en speciaal',
html:`<h2>Privéadressen</h2>
<p>Sommige adressen zijn vrij te gebruiken door iedereen, binnen een thuis-, school- of bedrijfsnetwerk. Dat zijn <b>privéadressen</b>. Routers op het internet sturen ze nooit door, dus van buitenaf zijn ze onbereikbaar.</p>
<div class="tw"><table><thead><tr><th>Privébereik</th><th>Herken je aan</th></tr></thead><tbody><tr><td class="b">10.0.0.0 – 10.255.255.255</td><td>begint met 10</td></tr><tr><td class="b">172.16.0.0 – 172.31.255.255</td><td>begint met 172.16 tot 172.31</td></tr><tr><td class="b">192.168.0.0 – 192.168.255.255</td><td>begint met 192.168</td></tr></tbody></table></div>
<p>Daarom kan jouw laptop thuis 192.168.1.10 hebben, en de laptop van je buren ook. Ze zitten elk in een ander privénetwerk, dus ze zitten elkaar niet in de weg.</p>
<h2>Publieke adressen</h2>
<p>Een <b>publiek adres</b> is uniek op het hele internet. Je router krijgt er één van je internetprovider. Een voorbeeld is <code>8.8.8.8</code>, een DNS-server van Google. Elk geldig adres dat niet privé en niet speciaal is, is publiek.</p>
${VGL('Een privéadres is een lokaalnummer op school: een "lokaal 12" bestaat in heel veel scholen. Een publiek adres is het adres van de school zelf: dat bestaat maar één keer.')}
<h2>Speciale adressen</h2>
<div class="tw"><table><thead><tr><th>Adres</th><th>Naam</th><th>Betekenis</th></tr></thead><tbody>
<tr><td class="b">127.0.0.1</td><td>loopback</td><td>de computer zelf. Alles wat begint met 127 is loopback.</td></tr>
<tr><td class="b">169.254.x.x</td><td>APIPA</td><td>de pc kreeg geen adres van de router en koos er zelf een. Meestal een teken dat er iets mis is met de verbinding.</td></tr>
<tr><td class="b">0.0.0.0</td><td>geen adres</td><td>het toestel heeft (nog) geen adres</td></tr>
<tr><td class="b">255.255.255.255</td><td>broadcast</td><td>een bericht naar iedereen in het lokale netwerk</td></tr></tbody></table></div>
<h2>Zo herken je elk adres: 4 vragen</h2>
<ol><li>Is het geldig? Nee → <b>ongeldig</b>.</li><li>Is het speciaal? Begint het met 127 of 169.254, of is het 0.0.0.0 of 255.255.255.255? → <b>speciaal</b>.</li><li>Is het privé? Begint het met 10, 172.16 tot 172.31 of 192.168? → <b>privé</b>.</li><li>Geen van allemaal? → <b>publiek</b>.</li></ol>
<p>Let op de valkuil: 172.32.1.1 lijkt privé, maar alleen 172.16 tot en met 172.31 is privé. En 11.0.0.1 is publiek: alleen 10 is privé.</p>
<h2>Klassen</h2>
<p>Vroeger werden adressen in <b>klassen</b> verdeeld. Dat systeem wordt vandaag niet meer gebruikt, maar het helpt om een adres snel te herkennen aan het eerste getal:</p>
${klTable('')}
${ONT('Privé: 10 · 172.16 tot 172.31 · 192.168. Speciaal: 127 · 169.254 · 0.0.0.0 · 255.255.255.255. Alle andere geldige adressen zijn publiek.')}`,
quiz:[{q:'Welk soort adres is 172.32.5.1?',o:['Privé','Publiek','Speciaal','Ongeldig'],a:1,w:'Alleen 172.16 tot en met 172.31 is privé. 172.32 valt erbuiten, dus het is publiek.'},
{q:'Je pc krijgt het adres 169.254.20.3. Wat betekent dat?',o:['Hij kreeg geen adres van de router','Hij is gehackt','Alles werkt perfect'],a:0,w:'Een 169.254-adres (APIPA) kiest de pc zelf als hij geen adres krijgt van de router. Controleer de kabel of de wifi.'},
{q:'In welke klasse valt 150.10.1.1?',o:['A','B','C'],a:1,w:'150 ligt tussen 128 en 191: klasse B.'}],
practice:['soort','klasse']},

{short:'NAT en bridged',title:'NAT: veel toestellen, één publiek adres',
html:`<p>In hoofdstuk 3 zag je dat er maar zo'n 4,3 miljard IPv4-adressen zijn. Toch zijn er in één gezin vaak meer dan tien toestellen online. Hoe kan dat?</p>
<h2>De oplossing: NAT</h2>
<p><b>NAT</b> staat voor <i>Network Address Translation</i>, letterlijk: adresvertaling. Zo werkt het:</p>
<ol><li>Je router krijgt <b>één publiek adres</b> van je internetprovider.</li><li>Alle toestellen thuis krijgen een <b>privéadres</b>, bijvoorbeeld 192.168.1.x.</li><li>Stuurt je laptop iets naar het internet, dan vervangt de router het privéadres door zijn eigen publieke adres. Hij onthoudt welk toestel wat gevraagd heeft.</li><li>Komt het antwoord terug, dan stuurt de router het door naar het juiste toestel.</li></ol>
<div class="vis"><div class="flow"><div class="node"><b>Thuisnetwerk (privé)</b>laptop 192.168.1.10<br>gsm 192.168.1.11<br>tv 192.168.1.12</div>${ARR}<div class="node dark"><b>Router met NAT</b>vertaalt privé ↔ publiek</div>${ARR}<div class="node"><b>Internet</b>ziet maar één adres:<br>203.0.113.5</div></div><p class="sub">203.0.113.5 is een voorbeeldadres.</p></div>
${VGL('Een bedrijf met één postadres. Alle brieven komen toe bij het onthaal, en dat brengt elke brief naar het juiste bureau. De buitenwereld kent alleen het adres van het bedrijf.')}
<h2>NAT of bridged bij een virtuele machine</h2>
<p>Een <b>virtuele machine</b> (VM) is een computer die als programma draait binnen je echte computer, bijvoorbeeld in VirtualBox of VMware. Zo kan je bijvoorbeeld Linux uitproberen op een Windows-pc. Ook een VM heeft een netwerkverbinding nodig, en daarvoor kies je tussen twee standen:</p>
<div class="tw"><table><thead><tr><th></th><th>NAT</th><th>Bridged</th></tr></thead><tbody>
<tr><td>Hoe werkt het?</td><td>De VM zit verstopt achter je pc. Je pc vertaalt het verkeer, net zoals een router.</td><td>De VM gedraagt zich als een apart toestel in je netwerk, naast je pc.</td></tr>
<tr><td>IP-adres van de VM</td><td>een apart intern adres, bv. <code>10.0.2.15</code></td><td>een adres uit hetzelfde netwerk als je pc, bv. <code>192.168.1.x</code></td></tr>
<tr><td>Zichtbaar voor andere toestellen?</td><td>nee</td><td>ja</td></tr></tbody></table></div>
${ONT('Met NAT delen veel toestellen één publiek adres. Bij een VM betekent NAT: verstopt achter je pc. Bridged betekent: een apart toestel in je netwerk.')}`,
quiz:[{q:'Wat doet NAT?',o:['Het vertaalt privéadressen naar één publiek adres','Het maakt je internet sneller','Het zet namen om in IP-adressen'],a:0,w:'NAT vertaalt tussen de privéadressen binnen en het publieke adres buiten. Namen omzetten is het werk van DNS.'},
{q:'Je VM staat op bridged. Welk adres krijgt ze?',o:['Een adres uit hetzelfde netwerk als je pc, bv. 192.168.1.x','Altijd 10.0.2.15','Geen adres'],a:0,w:'Bij bridged is de VM een apart toestel in je netwerk, dus ze krijgt een adres van de router, net als je pc.'}],
practice:[]},

{short:'IPv6',title:'IPv6: de opvolger',
html:`<p><b>IPv6</b> is de opvolger van IPv4. Het werd bedacht omdat de IPv4-adressen opraken.</p>
<h2>Veel, veel meer adressen</h2>
<p>Een IPv6-adres is <b>128 bits</b> lang in plaats van 32. Dat geeft ongeveer 3,4 × 10<sup>38</sup> adressen: een getal van 39 cijfers. Daarmee raken we nooit meer door de adressen heen.</p>
<h2>Hoe schrijf je het?</h2>
<p>128 bits als decimale getallen schrijven zou veel te lang worden. Daarom gebruikt IPv6 <b>hexadecimaal</b>: 8 groepen van 4 hex-cijfers, gescheiden door dubbelpunten.</p>
<p class="addr small">2001:0db8:0000:0000:0000:ff00:0042:8329</p>
<h2>Verkorten in 2 regels</h2>
<ol><li><b>Voorloopnullen</b> in een groep mag je weglaten: <code>0db8</code> wordt <code>db8</code>, <code>0042</code> wordt <code>42</code> en <code>0000</code> wordt <code>0</code>.</li><li><b>Eén reeks</b> groepen met alleen nullen mag je vervangen door <code>::</code>. Dat mag maar één keer per adres, anders weet je niet meer hoeveel groepen nullen er waren.</li></ol>
<div class="vis v6"><div><span class="k">Volledig</span><code>2001:0db8:0000:0000:0000:ff00:0042:8329</code></div><div><span class="k">Na regel 1</span><code>2001:db8:0:0:0:ff00:42:8329</code></div><div><span class="k">Na regel 2</span><code>2001:db8::ff00:42:8329</code></div></div>
<h2>IPv4 en IPv6 naast elkaar</h2>
<div class="tw"><table><thead><tr><th></th><th>IPv4</th><th>IPv6</th></tr></thead><tbody>
<tr><td>Lengte</td><td>32 bits</td><td>128 bits</td></tr>
<tr><td>Schrijfwijze</td><td>4 decimale getallen met punten</td><td>8 groepen hexa met dubbelpunten</td></tr>
<tr><td>Voorbeeld</td><td class="b">192.168.1.10</td><td class="b">2001:db8::ff00:42:8329</td></tr>
<tr><td>Aantal adressen</td><td>± 4,3 miljard</td><td>± 3,4 × 10<sup>38</sup></td></tr>
<tr><td>Loopback</td><td class="b">127.0.0.1</td><td class="b">::1</td></tr></tbody></table></div>
${ONT('IPv6 = 128 bits, in hexa, 8 groepen met dubbelpunten. Voorloopnullen mogen weg, en één reeks nulgroepen wordt ::.')}`,
quiz:[{q:'Hoeveel bits heeft een IPv6-adres?',o:['32','64','128'],a:2,w:'IPv6 heeft 128 bits, 4 keer zoveel als IPv4.'},

/* ---------- Extra oefeningen ---------- */
const fmtN=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const v6strip=x=>x.replace(/^0+(?=.)/,'');
function v6gen(){
  const g=['2001','0db8'], len=rand(2,4), s=rand(2,8-len);
  for(let i=2;i<8;i++){
    if(i>=s&&i<s+len){g.push('0000');continue;}
    const f=pick([1,2,3,4]);
    const v=f===1?rand(1,15):f===2?rand(16,255):f===3?rand(256,4095):rand(4096,65535);
    g.push(v.toString(16).padStart(4,'0'));
  }
  const st=g.map(v6strip), right=st.slice(s+len).join(':');
  return {g,s,len,full:g.join(':'),rule1:st.join(':'),canon:st.slice(0,s).join(':')+'::'+right};
}
function netOf(a,k){return a.slice(0,k).join('.');}
function fillHost(a,k,v){return a.map((x,i)=>i<k?x:v).join('.');}
function octTable(a){return `<div class="tw"><table><thead><tr><th>Getal</th><th>Som</th><th>8 bits</th></tr></thead><tbody>${a.map(x=>`<tr><td class="b">${x}</td><td>${expr(x)}</td><td class="b">${bin8(x)}</td></tr>`).join('')}</tbody></table></div>`;}

Object.assign(M,{
  hex2dec:{group:'Talstelsels',title:'Hexa → decimaal',
    steps:['Zet elk hex-cijfer om naar een getal (A = 10 … F = 15).','Schrijf elk getal als <b>4 bits</b> met 8 – 4 – 2 – 1 en plak de twee stukken aan elkaar.','Tel de waarden boven de enen op (128 … 1).'],
    ref:HEXROW,
    gen:()=>({n:rand(16,255)}),
    render(q,el){el.innerHTML=`<p class="prompt">Zet <span class="num">${hx2(q.n)}</span> om naar decimaal. Ga via binair.</p><div class="fields">${field('ansb','Stap 1 en 2 · binair (8 bits)',{numeric:true,max:8})}${field('ansd','Stap 3 · decimaal',{numeric:true,max:3})}</div>`;},
    check(q,el){
      const b=inputVal(el,'ansb'), d=inputVal(el,'ansd');
      if(!b&&!d) return {empty:true,msg:'Vul eerst het binaire getal in, en daarna het decimale.'};
      const bOk=/^[01]{1,8}$/.test(b)&&parseInt(b,2)===q.n, dOk=/^\d+$/.test(d)&&+d===q.n;
      const path=`${hx2(q.n)} → <code>${bin8(q.n).slice(0,4)} ${bin8(q.n).slice(4)}</code> → ${expr(q.n)} = <b>${q.n}</b>`;
      if(dOk&&(bOk||!b)) return {ok:true,msg:path+'.'+(!b?' Vul de volgende keer ook het binaire getal in.':'')};
      const lines=[!b?'Het binaire getal is nog leeg.':bOk?'Het binaire getal is juist.':'Het binaire getal klopt nog niet. Zet elk hex-cijfer apart om in 4 bits.',
        !d?'Het decimale getal is nog leeg.':dOk?'Het decimale getal is juist.':'Het decimale getal klopt nog niet. Tel de waarden boven de enen op.'];
      return {ok:false,msg:lines.map(x=>`<p>${x}</p>`).join('')};
    },
    hintMax:2,
    hint(q,l){const hi=q.n>>4, lo=q.n&15, b=bin8(q.n);
      if(l===1) return `<p>${hx(hi)} = ${hi} en ${hx(lo)} = ${lo}. Schrijf elk getal als 4 bits met 8 – 4 – 2 – 1.</p>`;
      return `<p>${hi} = <code>${b.slice(0,4)}</code> en ${lo} = <code>${b.slice(4)}</code>. Samen: <code>${b}</code>. Tel nu op.</p>`;},
    solution:q=>`<p>${hx2(q.n)} → <code>${bin8(q.n).slice(0,4)} ${bin8(q.n).slice(4)}</code> → ${expr(q.n)} = <b>${q.n}</b></p>`
  },

  ip2bin:{group:'IPv4',title:'IP-adres ↔ binair',
    steps:['Een IP-adres bestaat uit <b>4 getallen</b> van elk 8 bits.','Zet <b>elk getal apart</b> om met de rij 128 · 64 · 32 · 16 · 8 · 4 · 2 · 1.','Schrijf altijd <b>8 bits</b> per getal: vul aan met nullen vooraan.'],
    gen(){const a=pick([[192,168,rand(0,255),rand(1,254)],[10,rand(0,255),rand(0,255),rand(1,254)],[172,rand(16,31),rand(0,255),rand(1,254)],[rand(1,223),rand(0,255),rand(0,255),rand(1,254)]]); return {a,dir:pick(['toBin','toDec'])};},
    render(q,el){
      if(q.dir==='toBin') el.innerHTML=`<p class="prompt">Schrijf <span class="num">${q.a.join('.')}</span> binair, getal per getal.</p><div class="fields">${q.a.map((x,i)=>field('o'+i,`Getal ${i+1}: ${x}`,{numeric:true,max:8})).join('')}</div>`;
      else el.innerHTML=`<p class="prompt">Welk IP-adres is dit? Zet elk stuk van 8 bits om.</p><p class="addr" style="font-size:clamp(17px,3.2vw,30px)">${q.a.map(bin8).join('.')}</p><div class="fields">${q.a.map((x,i)=>field('o'+i,`Stuk ${i+1}: ${bin8(x)}`,{numeric:true,max:3})).join('')}</div>`;
    },
    check(q,el){
      const v=[0,1,2,3].map(i=>inputVal(el,'o'+i));
      if(v.every(x=>!x)) return {empty:true,msg:'Vul de 4 vakjes in.'};
      const ok=v.map((x,i)=>q.dir==='toBin'?(/^[01]{1,8}$/.test(x)&&parseInt(x,2)===q.a[i]):(/^\d+$/.test(x)&&+x===q.a[i]));
      if(ok.every(Boolean)) return {ok:true,msg:`<code>${q.a.join('.')}</code> = <code>${q.a.map(bin8).join('.')}</code>`};
      return {ok:false,msg:v.map((x,i)=>`<p>${q.dir==='toBin'?'Getal':'Stuk'} ${i+1}: ${!x?'nog leeg.':ok[i]?'juist.':'klopt nog niet.'}</p>`).join('')};
    },
    hintMax:1,
    hint:q=>`<p>Werk getal per getal. Voorbeeld voor het eerste: ${q.a[0]} = ${expr(q.a[0])} = <code>${bin8(q.a[0])}</code>.</p>`,
    solution:q=>`<p><code>${q.a.join('.')}</code> = <code>${q.a.map(bin8).join('.')}</code></p>${octTable(q.a)}`
  },

  samenet:{group:'IPv4',title:'Zelfde netwerk?',choice:true,
    steps:['Kijk naar het masker: <b>/24</b> = eerste 3 getallen, <b>/16</b> = eerste 2, <b>/8</b> = eerste getal.','Vergelijk alleen dat <b>netwerkdeel</b> van de twee adressen.','Helemaal gelijk? Dan zitten ze in <b>hetzelfde netwerk</b>. Eén verschil? Dan niet, en moet het verkeer via de router.'],
    gen(){
      const pre=pick([24,24,24,16,16,8]), k=pre/8;
      const a=pick([[192,168,rand(0,255),0],[10,rand(0,255),rand(0,255),0],[172,rand(16,31),rand(0,255),0]]);
      for(let i=k;i<4;i++) a[i]=i===3?rand(1,254):rand(0,255);
      const b=a.slice(); for(let i=k;i<4;i++) b[i]=i===3?rand(1,254):rand(0,255);
      if(b.join('.')===a.join('.')) b[3]=a[3]===254?1:a[3]+1;
      const same=Math.random()<.5;
      if(!same){const j=k-1; b[j]=(a[j]+rand(1,5))%256;}
      return {a,b,pre,k,same};
    },
    render(q,el){
      el.innerHTML=`<p class="prompt">Zitten deze twee toestellen in hetzelfde netwerk?</p>
        <p class="addr" style="font-size:clamp(22px,4.4vw,38px)">${q.a.join('.')}/${q.pre}<br>${q.b.join('.')}/${q.pre}</p>
        <div class="choices"><button type="button" class="choice" data-ans="ja">Ja, hetzelfde netwerk</button><button type="button" class="choice" data-ans="nee">Nee, een ander netwerk</button></div>`;
    },
    correct:q=>q.same?'ja':'nee',
    check(q,el,ans){
      const na=netOf(q.a,q.k), nb=netOf(q.b,q.k);
      return {ok:ans===(q.same?'ja':'nee'),msg:`<p>Bij /${q.pre} is het netwerkdeel ${q.k===1?'het eerste getal':`de eerste ${q.k} getallen`}.</p><p><code>${na}</code> en <code>${nb}</code> zijn ${q.same?'<b>gelijk</b>: hetzelfde netwerk.':'<b>verschillend</b>: een ander netwerk. Het verkeer moet via de router.'}</p>`};
    }
  },

  netmask:{group:'IPv4',title:'Netwerkadres: /8, /16, /24',
    steps:['Tel het netwerkdeel: <b>/8</b> = 1 getal, <b>/16</b> = 2 getallen, <b>/24</b> = 3 getallen.','Netwerkadres: de rest wordt <b>0</b>. Broadcastadres: de rest wordt <b>255</b>.','Bruikbare adressen: 2<sup>hostbits</sup> − 2. /24 → 254 · /16 → 65 534 · /8 → 16 777 214.'],
    gen(){
      const pre=pick([8,16,24]), a=pick([[192,168,rand(0,255),rand(1,254)],[10,rand(0,255),rand(0,255),rand(1,254)],[172,rand(16,31),rand(0,255),rand(1,254)]]);
      return {a,pre,k:pre/8};
    },
    render(q,el){el.innerHTML=`<p class="prompt">Een toestel heeft IP-adres <span class="num">${q.a.join('.')}/${q.pre}</span>.</p><div class="fields">${field('ansn','Netwerkadres')}${field('ansb','Broadcastadres')}${field('ansc','Aantal bruikbare adressen',{numeric:true,max:12})}</div>`;},
    check(q,el){
      const norm=s=>s.replace(/\s/g,'').replace(/\/\d+$/,'');
      const n=norm(inputVal(el,'ansn')), b=norm(inputVal(el,'ansb')), c=inputVal(el,'ansc').replace(/[\s.]/g,'');
      if(!n&&!b&&!c) return {empty:true,msg:'Vul het netwerkadres, het broadcastadres en het aantal bruikbare adressen in.'};
      const en=fillHost(q.a,q.k,0), eb=fillHost(q.a,q.k,255), ec=String(2**(32-q.pre)-2);
      const oks=[n===en,b===eb,c===ec];
      if(oks.every(Boolean)) return {ok:true,msg:`Netwerkadres <code>${en}</code>, broadcast <code>${eb}</code>, ${fmtN(+ec)} bruikbare adressen.`};
      const names=['Het netwerkadres','Het broadcastadres','Het aantal bruikbare adressen'], vals=[n,b,c];
      return {ok:false,msg:names.map((x,i)=>`<p>${x} ${!vals[i]?'is nog leeg.':oks[i]?'is juist.':'klopt nog niet.'}</p>`).join('')};
    },
    hintMax:2,
    hint(q,l){
      if(l===1) return `<p>Bij /${q.pre} is het netwerkdeel <code>${netOf(q.a,q.k)}</code>. Houd dat en vul de rest aan.</p>`;
      return `<p>Netwerkadres: vul aan met 0. Broadcast: vul aan met 255.<br>Hostbits: 32 − ${q.pre} = ${32-q.pre}. Aantal: 2<sup>${32-q.pre}</sup> − 2.</p>`;
    },
    solution:q=>`<p>Netwerkadres <b>${fillHost(q.a,q.k,0)}</b> · broadcast <b>${fillHost(q.a,q.k,255)}</b> · 2<sup>${32-q.pre}</sup> − 2 = <b>${fmtN(2**(32-q.pre)-2)}</b> bruikbare adressen</p>`
  },

  ipv6kort:{group:'IPv6, NAT en DNS',title:'IPv6 verkorten',

    gen:()=>v6gen(),
    render(q,el){el.innerHTML=`<p class="prompt">Schrijf dit IPv6-adres zo kort mogelijk.</p><p class="addr" style="font-size:clamp(15px,3vw,28px)">${q.full}</p>${field('ans','Korte vorm',{max:39})}`; const i=el.querySelector('#ans'); if(i) i.setAttribute('autocapitalize','off');},
    check(q,el){
      const s=inputVal(el,'ans').toLowerCase().replace(/\s/g,'');
      if(!s) return {empty:true,msg:'Typ de korte vorm in het vak.'};
      const dc=(s.match(/::/g)||[]).length;
      if(dc>1) return {ok:false,msg:':: mag maar één keer voorkomen in een adres.'};
      let groups, given, missing=0;
      if(dc===1){const [l,r]=s.split('::'); const Lg=l?l.split(':'):[], Rg=r?r.split(':'):[]; missing=8-Lg.length-Rg.length; if(missing<1) return {ok:false,msg:'Er staan te veel groepen in.'}; given=[...Lg,...Rg]; groups=[...Lg,...Array(missing).fill('0'),...Rg];}
      else {groups=s.split(':'); given=groups;}
      if(groups.length!==8||groups.some(x=>!/^[0-9a-f]{1,4}$/.test(x))) return {ok:false,msg:'Dit is geen geldig IPv6-adres. Controleer de dubbelpunten, en gebruik alleen 0–9 en a–f.'};
      if(!groups.every((x,i)=>x.padStart(4,'0')===q.g[i])) return {ok:false,msg:'Dit adres is niet meer hetzelfde als het origineel. Laat alleen nullen <b>vooraan</b> in een groep weg, en vervang alleen groepen met enkel nullen door ::.'};
      if(given.some(x=>x.length>1&&x[0]==='0')) return {ok:false,msg:'Het adres klopt, maar er staan nog nullen vooraan in een groep. Regel 1: laat die weg.'};
      if(missing<q.len) return {ok:false,msg:'Het adres klopt, maar het kan nog korter. Regel 2: vervang de hele reeks nullen door ::.'};
      return {ok:true,msg:`<p>Regel 1: <code>${q.rule1}</code><br>Regel 2: <code>${q.canon}</code></p>`};
    },
    hintMax:2,
    hint:(q,l)=>l===1?`<p>Na regel 1: <code>${q.rule1}</code></p>`:`<p>De reeks nullen zijn groep ${q.s+1} tot ${q.s+q.len}. Vervang die door ::.</p>`,
    solution:q=>`<p>Volledig: <code>${q.full}</code><br>Regel 1: <code>${q.rule1}</code><br>Regel 2: <b><code>${q.canon}</code></b></p>`

/* ---------- Gateway, DHCP en MAC ---------- */
function macGen(){return Array.from({length:6},()=>rand(0,255).toString(16).toUpperCase().padStart(2,'0')).join('-');}
function ipcGen(apipa){
  const net=pick([[192,168,rand(0,20)],[10,rand(0,255),rand(0,255)],[172,rand(16,31),rand(0,255)]]).join('.');
  const gw=`${net}.${pick([1,254])}`;
  if(apipa) return {apipa:true,net:'169.254',ip:`169.254.${rand(1,254)}.${rand(1,254)}`,mask:'255.255.0.0',gw:'',dns:'',mac:macGen()};
  let host; do{host=rand(2,200);}while(`${net}.${host}`===gw);
  return {apipa:false,net,ip:`${net}.${host}`,mask:'255.255.255.0',gw,dns:pick([gw,'8.8.8.8','1.1.1.1']),mac:macGen()};
}
function ipcBlock(c){
  return `<pre class="term">Ethernet-adapter Ethernet:

   Fysiek adres. . . . . . . . . . : ${c.mac}
   DHCP ingeschakeld . . . . . . . : Ja
   IPv4-adres. . . . . . . . . . . : ${c.ip}
   Subnetmasker. . . . . . . . . . : ${c.mask}
   Standaardgateway. . . . . . . . : ${c.gw}
   DNS-servers . . . . . . . . . . : ${c.dns}</pre>`;
}

T.splice(4,0,{short:'Gateway, DHCP en MAC',title:'Gateway, DHCP en MAC-adres',
html:`<p>Als je <code>ipconfig /all</code> typt, zie je veel meer dan alleen je IP-adres. In dit hoofdstuk leer je de andere regels lezen.</p>
<div class="vis">${ipcBlock(IPC_EX)}</div>
<h2>De standaardgateway: de deur naar buiten</h2>
<p>De <b>standaardgateway</b> is het adres van de <b>router</b> in jouw netwerk. Wil je pc iets sturen naar een toestel in een <b>ander netwerk</b>, bijvoorbeeld een website, dan stuurt hij het naar de gateway. De router stuurt het verder.</p>
<p>Voor een toestel in hetzelfde netwerk (hetzelfde netwerkdeel) is de gateway niet nodig: dan praten ze rechtstreeks. De gateway zit dus altijd in hetzelfde netwerk als je pc, en zijn adres eindigt meestal op <b>.1</b> of <b>.254</b>.</p>
${VGL('De voordeur van je huis. Om naar een andere kamer te gaan, blijf je binnen. Om naar een ander huis te gaan, moet je via de voordeur naar buiten.')}
<h2>DHCP: adressen automatisch uitdelen</h2>
<p>Niemand typt thuis zelf een IP-adres in. Dat doet <b>DHCP</b>, het <i>Dynamic Host Configuration Protocol</i>. Meestal is je router ook de DHCP-server. Komt er een toestel in het netwerk, dan krijgt het automatisch:</p>
<ul><li>een <b>IP-adres</b></li><li>het <b>subnetmasker</b></li><li>de <b>standaardgateway</b></li><li>het adres van de <b>DNS-server</b></li></ul>
<p>Het adres is uitgeleend voor een bepaalde tijd: de <b>lease</b>. Werkt DHCP niet, dan kiest Windows zelf een <b>169.254</b>-adres (APIPA). Daarmee kan je niet op het internet.</p>
<p>Sommige toestellen, zoals printers en servers, krijgen een <b>statisch</b> adres: dat stel je zelf vast in, zodat het nooit verandert.</p>
${VGL('Het onthaal van een hotel. Bij aankomst krijg je een kamernummer en uitleg waar de uitgang is. Bij vertrek geef je de kamer terug.')}
<h2>Het MAC-adres: het serienummer van je netwerkkaart</h2>
<p>Elke netwerkkaart, voor wifi of voor een kabel, heeft een vast <b>MAC-adres</b>, ingesteld door de fabrikant. Het is <b>48 bits</b> lang en wordt geschreven als <b>6 paren hexa</b>, bijvoorbeeld <code>3C-52-82-1A-9F-07</code>. In <code>ipconfig /all</code> heet het <b>Fysiek adres</b>.</p>
<div class="tw"><table><thead><tr><th></th><th>IP-adres</th><th>MAC-adres</th></tr></thead><tbody>
<tr><td>Lengte</td><td>32 bits (IPv4)</td><td>48 bits</td></tr>
<tr><td>Schrijfwijze</td><td>4 decimale getallen</td><td>6 paren hexa</td></tr>
<tr><td>Verandert het?</td><td>ja, in elk netwerk een ander</td><td>nee, het zit vast in de netwerkkaart</td></tr>
<tr><td>Wie kiest het?</td><td>DHCP, of jijzelf (statisch)</td><td>de fabrikant</td></tr></tbody></table></div>
${VGL('Het IP-adres is je postadres: als je verhuist, krijg je een nieuw. Het MAC-adres is je naam: die neem je overal mee.')}
${ONT('Standaardgateway = de router, de deur naar andere netwerken. DHCP deelt automatisch adressen uit; zonder DHCP krijg je 169.254. Het MAC-adres is het vaste hardware-adres: 6 paren hexa.')}`,
quiz:[{q:'Wat is de standaardgateway?',o:['Het adres van de router','Het adres van een website','Het MAC-adres van je pc'],a:0,w:'De standaardgateway is de router: de deur naar andere netwerken.'},
{q:'Wat doet DHCP?',o:['Het deelt automatisch IP-adressen uit','Het zet namen om in IP-adressen','Het verkort IPv6-adressen'],a:0,w:'DHCP geeft elk nieuw toestel een IP-adres, masker, gateway en DNS-server. Namen omzetten is het werk van DNS.'},
{q:'Je neemt je laptop mee van thuis naar school. Wat verandert er?',o:['Het IP-adres','Het MAC-adres','Allebei'],a:0,w:'Op school krijg je van een andere DHCP-server een ander IP-adres. Het MAC-adres zit vast in je netwerkkaart.'}],

    gen(){const c=pick([rand(2,6),rand(7,14),rand(15,30),rand(31,62),rand(63,126),rand(127,254),rand(255,510),rand(63,126),rand(31,62)]); let h=2; while(2**h-2<c) h++; const p=32-h; return {c,h,p,mask:maskOf('/'+p).mask};},
    render(q,el){el.innerHTML=`<p class="prompt">Je wil <span class="num">${q.c}</span> computers in één netwerk. Welk subnetmasker kies je? Neem het kleinste netwerk dat past.</p><div class="fields">${field('ansp','Kort, bv. /26',{max:3})}${field('ansm','Subnetmasker',{max:15})}</div>`;},

    solution:q=>`<p>${q.c} computers → ${q.h} hostbits (2<sup>${q.h}</sup> − 2 = ${2**q.h-2}) → <b>/${q.p}</b> = <b>${q.mask}</b></p>`

    gen(){

      const pre=pick([24,24,16]), base=pick([[192,168,rand(0,50)],[172,16,rand(0,50)],[10,rand(0,50),rand(0,50)]]);
      const a=[...base,rand(2,200)], mk=maskOf('/'+pre), net=int2ip((ip2int(a.join('.'))&mk.n)>>>0).split('.').map(Number);

T[0].title='Netwerken, het OSI-model en TCP/IP'; T[0].short='Netwerken en OSI-model';
T[0].html+=`<h2>Het OSI-model: communicatie in 7 lagen</h2>
<p>Om van jouw laptop naar een website te gaan, moet heel veel goed gaan: de kabel of wifi, de adressen, de controle of alles aankomt, de browser … Het <b>OSI-model</b> (Open Systems Interconnection) verdeelt dat werk in <b>7 lagen</b>. Elke laag heeft één taak en rekent op de laag eronder. Het is een internationale afspraak van <b>ISO</b>, zodat fabrikanten en programmeurs dezelfde taal spreken.</p>
<div class="vis">${osiTable(0)}</div>
<p>Ezelsbrug om de volgorde te onthouden: ${OSIEZEL}.</p>
${VGL('Een brief versturen. Jij schrijft de brief (de gegevens), stopt hem in een envelop met een adres, de post bezorgt hem, en de ontvanger haalt hem weer uit de envelop. Elke stap heeft zijn eigen taak.')}
<h2>Het TCP/IP-model: de praktijkversie</h2>
<p>Het internet werkt in de praktijk met het <b>TCP/IP-model</b>. Dat voegt de 7 OSI-lagen samen tot 4. In sommige boeken zie je 5 lagen, omdat de onderste laag opgesplitst wordt in Datalink en Fysiek. Beide zijn juist.</p>
<div class="tw"><table><thead><tr><th>TCP/IP-laag</th><th>OSI-lagen</th><th>Wat gebeurt er als je naar www.microsoft.com surft?</th></tr></thead><tbody>
<tr><td><b>Applicatie</b></td><td>7, 6, 5</td><td>Edge toont de pagina, HTTPS versleutelt, de sessie wordt beheerd</td></tr>
<tr><td><b>Transport</b></td><td>4</td><td>TCP controleert of alle pakketjes aankomen</td></tr>
<tr><td><b>Internet</b></td><td>3</td><td>IP zorgt dat de gegevens de juiste weg volgen</td></tr>
<tr><td><b>Netwerktoegang</b></td><td>2, 1</td><td>je switch gebruikt MAC-adressen, wifi of kabel verstuurt de signalen</td></tr></tbody></table></div>
<h2>TCP of UDP?</h2>
<p>In de transportlaag kies je tussen twee protocollen. <b>TCP</b> (Transmission Control Protocol) is <i>connection oriented</i>: het maakt een verbinding en controleert alles. <b>UDP</b> (User Datagram Protocol) is <i>connection-less</i>: het verstuurt gewoon.</p>
<div class="tw"><table><thead><tr><th></th><th>TCP</th><th>UDP</th></tr></thead><tbody>
<tr><td>Werkwijze</td><td>controleert of alles aankomt, ontbrekende pakketjes opnieuw</td><td>verstuurt zonder te controleren</td></tr>
<tr><td>Voordeel</td><td>betrouwbaar</td><td>heel snel</td></tr>
<tr><td>Nadeel</td><td>iets trager</td><td>gegevens kunnen verloren gaan</td></tr>
<tr><td>Voorbeelden</td><td>websites, e-mail, downloads</td><td>gaming, streaming, videobellen, VoIP</td></tr></tbody></table></div>
${VGL('TCP is een aangetekende brief: de ontvanger controleert of alle pagina\'s er zijn. UDP is een omroepbericht: je roept iets, maar controleert niet of iedereen het hoorde.')}
${ONT('OSI-model: 7 lagen (Fysiek, Datalink, Netwerk, Transport, Sessie, Presentatie, Applicatie). TCP/IP-model: 4 lagen. TCP = betrouwbaar, UDP = snel.')}`;

<p>Soms moet je zelf een masker kiezen: "welk masker neem ik voor 120 computers?" Hoe meer <b>hostbits</b> (nullen in het masker), hoe meer toestellen. Met h hostbits heb je 2<sup>h</sup> − 2 bruikbare adressen.</p>
<ol><li>Zoek het kleinste aantal hostbits waarbij 2<sup>h</sup> − 2 minstens het aantal toestellen is.</li><li>Het getal achter de / is 32 − h.</li><li>Schrijf het masker: de enen staan links.</li></ol>
<div class="tw"><table><thead><tr><th>Kort</th><th>Masker</th><th>Hostbits</th><th>Toestellen</th></tr></thead><tbody><tr><td>/24</td><td class="b">255.255.255.0</td><td>8</td><td>254</td></tr><tr><td>/25</td><td class="b">255.255.255.128</td><td>7</td><td>126</td></tr><tr><td>/26</td><td class="b">255.255.255.192</td><td>6</td><td>62</td></tr><tr><td>/27</td><td class="b">255.255.255.224</td><td>5</td><td>30</td></tr><tr><td>/28</td><td class="b">255.255.255.240</td><td>4</td><td>14</td></tr><tr><td>/29</td><td class="b">255.255.255.248</td><td>3</td><td>6</td></tr><tr><td>/30</td><td class="b">255.255.255.252</td><td>2</td><td>2</td></tr></tbody></table></div>
<p>Voorbeelden: <b>120 computers</b> → 7 hostbits (126) → /25 = 255.255.255.128. <b>62 computers</b> → 6 hostbits (62) → /26 = 255.255.255.192. Het laatste getal van het masker is gewoon binair: 11000000 = 192.</p>`;
T[3].quiz.push({q:'Welk masker is het zuinigst voor 25 computers?',o:['/27 (255.255.255.224)','/28 (255.255.255.240)','/24 (255.255.255.0)'],a:0,w:'Met 5 hostbits: 2^5 − 2 = 30 ≥ 25. Met 4 hostbits heb je maar 14. /24 kan ook, maar is veel groter dan nodig.'});
